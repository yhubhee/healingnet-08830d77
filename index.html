    <meta name="description" content="Book video or in-person visits with licence-checked doctors at hospitals near you. Free for patients. Pay in naira. Hospitals: try EMR Essentials free for 30 days." />
    <meta name="theme-color" content="#186E6A" />

    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fraunces (latin) is the H1 font on the public site; Vite rewrites this to the hashed file the CSS uses. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Home only: start the hero photo download before the app's JavaScript runs.
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.type = "image/avif";
        l.setAttribute("imagesrcset", "/images/marketing/hero-patient-phone-480.avif 480w, /images/marketing/hero-patient-phone-960.avif 960w, /images/marketing/hero-patient-phone-1600.avif 1600w");
        l.setAttribute("imagesizes", "(min-width: 1024px) 460px, (min-width: 640px) 28rem, 92vw");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      }
    </script>
