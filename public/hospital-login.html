<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealingNet - Hospital Staff Login</title>
    <meta name="description" content="Hospital staff login portal for HealingNet Hospital Management System">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/export/healingnet-dashboard.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background, #0a0e17);
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--foreground, #e2e8f0);
            overflow: hidden;
        }

        /* Animated background */
        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, hsla(186, 82%, 47%, 0.08), transparent 70%);
            top: -200px;
            right: -150px;
            animation: float1 20s ease-in-out infinite;
        }
        .login-bg::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, hsla(160, 84%, 39%, 0.06), transparent 70%);
            bottom: -150px;
            left: -100px;
            animation: float2 18s ease-in-out infinite;
        }
        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px, 30px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px, -40px); } }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card, #111827);
            border: 1px solid var(--border, rgba(255,255,255,0.08));
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .login-logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, hsl(186, 82%, 47%), hsl(160, 84%, 39%));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .login-logo h1 span {
            color: hsl(186, 82%, 47%);
        }

        .login-subtitle {
            text-align: center;
            color: var(--muted-foreground, #94a3b8);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--muted-foreground, #94a3b8);
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--muted-foreground, #94a3b8);
            pointer-events: none;
        }
        .input-wrapper input {
            width: 100%;
            padding: 0.75rem 0.875rem 0.75rem 2.75rem;
            background: var(--background, #0a0e17);
            border: 1px solid var(--border, rgba(255,255,255,0.08));
            border-radius: 10px;
            color: var(--foreground, #e2e8f0);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper input:focus {
            border-color: hsl(186, 82%, 47%);
            box-shadow: 0 0 0 3px hsla(186, 82%, 47%, 0.15);
        }
        .input-wrapper input::placeholder {
            color: var(--muted-foreground, #64748b);
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted-foreground, #94a3b8);
            cursor: pointer;
            padding: 4px;
            pointer-events: auto;
        }
        .toggle-password i { position: static; transform: none; width: 18px; height: 18px; }

        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, hsl(186, 82%, 47%), hsl(160, 84%, 39%));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .login-btn:hover { opacity: 0.92; }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-error {
            background: hsla(0, 72%, 51%, 0.12);
            border: 1px solid hsla(0, 72%, 51%, 0.3);
            color: hsl(0, 72%, 65%);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        .login-error.show { display: flex; }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: var(--muted-foreground, #64748b);
        }
        .login-footer a {
            color: hsl(186, 82%, 47%);
            text-decoration: none;
        }
        .login-footer a:hover { text-decoration: underline; }

        .spinner-sm {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-bg"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <i data-lucide="building-2" style="width:24px;height:24px;"></i>
                </div>
                <h1>Healing<span>Net</span></h1>
            </div>
            <p class="login-subtitle">Hospital Staff Portal — Sign in to continue</p>

            <div class="login-error" id="loginError">
                <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0;"></i>
                <span id="loginErrorText">Invalid credentials</span>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" placeholder="staff@hospital.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePwd()">
                            <i data-lucide="eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="loginText">Sign In</span>
                    <div class="spinner-sm" id="loginSpinner"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>Need an account? Contact your hospital administrator.</p>
                <p style="margin-top:0.5rem;"><a href="/">← Back to Patient Portal</a></p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePwd() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                inp.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const errorText = document.getElementById('loginErrorText');
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');
            const btnText = document.getElementById('loginText');

            // Validate
            if (!email || !password) {
                errorText.textContent = 'Please enter your email and password.';
                errorEl.classList.add('show');
                return;
            }

            // Show loading
            errorEl.classList.remove('show');
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/hospital/auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    // Redirect to hospital dashboard
                    window.location.href = '/hospital-dashboard.html';
                } else {
                    errorText.textContent = data.message || 'Invalid credentials. Please try again.';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorText.textContent = 'Network error. Please check your connection.';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Sign In';
            }
        });

        // Check if already logged in
        fetch('/api/hospital/auth/me', { credentials: 'include' })
            .then(r => r.json())
            .then(d => {
                if (d.success) window.location.href = '/hospital-dashboard.html';
            })
            .catch(() => {});
    </script>
</body>
</html>
