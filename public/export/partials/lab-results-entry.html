<!-- Laboratory Results Entry Form -->
<div class="page-header">
    <div class="page-header-content">
        <h1><i data-lucide="flask-conical"></i> Laboratory Results Entry</h1>
        <p>Record and submit patient laboratory test results</p>
    </div>
</div>

<!-- Patient Information Section -->
<div class="content-section lab-patient-info">
    <h2><i data-lucide="user"></i> Patient Information</h2>
    <div class="patient-info-grid">
        <div class="form-group">
            <label for="patientSelect">Patient Name</label>
            <select id="patientSelect" class="form-control">
                <option value="">Select Patient...</option>
                <option value="1" data-id="PAT-2026-0001">Adaora Okonkwo</option>
                <option value="2" data-id="PAT-2026-0002">Chinedu Eze</option>
                <option value="3" data-id="PAT-2026-0003">Fatima Bello</option>
            </select>
        </div>
        <div class="form-group">
            <label for="patientId">Patient ID</label>
            <input type="text" id="patientId" class="form-control" readonly placeholder="Auto-filled">
        </div>
        <div class="form-group">
            <label for="sampleDate">Date of Sample Collection</label>
            <input type="date" id="sampleDate" class="form-control">
        </div>
        <div class="form-group">
            <label for="entryDate">Date of Result Entry</label>
            <input type="date" id="entryDate" class="form-control">
        </div>
    </div>
</div>

<!-- Predefined Laboratory Tests -->
<div class="content-section lab-tests-section">
    <div class="section-header">
        <h2><i data-lucide="test-tubes"></i> Laboratory Tests</h2>
        <div class="category-filter">
            <select id="categoryFilter" class="form-control">
                <option value="all">All Categories</option>
            </select>
        </div>
    </div>

    <!-- Test Categories Accordion -->
    <div class="lab-categories-accordion" id="labCategoriesAccordion">
        <!-- Categories will be dynamically populated -->
    </div>
</div>

<!-- Custom Test Entry -->
<div class="content-section custom-tests-section">
    <div class="section-header">
        <h2><i data-lucide="plus-circle"></i> Custom Tests</h2>
        <button type="button" class="btn btn-outline" id="addCustomTestBtn">
            <i data-lucide="plus"></i> Add Custom Test
        </button>
    </div>
    <div class="custom-tests-container" id="customTestsContainer">
        <!-- Custom tests will be added here dynamically -->
        <div class="empty-state" id="noCustomTests">
            <i data-lucide="beaker"></i>
            <p>No custom tests added. Click the button above to add one.</p>
        </div>
    </div>
</div>

<!-- Clinical Notes -->
<div class="content-section clinical-notes-section">
    <h2><i data-lucide="file-text"></i> Clinical Notes</h2>
    <div class="form-group">
        <label for="clinicalNotes">Doctor/Lab Scientist Remarks (Optional)</label>
        <textarea id="clinicalNotes" class="form-control" rows="4" placeholder="Enter any additional observations, recommendations, or notes..."></textarea>
    </div>
</div>

<!-- Submission Controls -->
<div class="form-actions">
    <button type="button" class="btn btn-secondary" id="cancelBtn">
        <i data-lucide="x"></i> Cancel
    </button>
    <button type="button" class="btn btn-outline" id="saveDraftBtn">
        <i data-lucide="save"></i> Save as Draft
    </button>
    <button type="button" class="btn btn-primary" id="submitResultsBtn">
        <i data-lucide="send"></i> Submit Results
    </button>
</div>

<!-- Custom Test Row Template -->
<template id="customTestTemplate">
    <div class="custom-test-row">
        <div class="custom-test-grid">
            <div class="form-group">
                <label>Test Name</label>
                <input type="text" class="form-control custom-test-name" placeholder="e.g., Specialized Marker">
            </div>
            <div class="form-group">
                <label>Parameter/Analyte</label>
                <input type="text" class="form-control custom-parameter" placeholder="e.g., Concentration">
            </div>
            <div class="form-group">
                <label>Result Value</label>
                <input type="text" class="form-control custom-result" placeholder="Enter value">
            </div>
            <div class="form-group">
                <label>Unit</label>
                <input type="text" class="form-control custom-unit" placeholder="e.g., mg/dL">
            </div>
            <div class="form-group">
                <label>Reference Range</label>
                <input type="text" class="form-control custom-reference" placeholder="e.g., 0-100">
            </div>
            <div class="form-group">
                <label>Notes</label>
                <input type="text" class="form-control custom-notes" placeholder="Optional comments">
            </div>
        </div>
        <button type="button" class="btn btn-icon btn-danger remove-custom-test">
            <i data-lucide="trash-2"></i>
        </button>
    </div>
</template>

    // State
    let selectedTests = {};
    let customTestCount = 0;

    // Initialize
    function init() {
        populateCategoryFilter();
        renderTestCategories();
        bindEvents();
        setDefaultDates();
        lucide.createIcons();
    }

    function setDefaultDates() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('sampleDate').value = today;
        document.getElementById('entryDate').value = today;
    }

    function populateCategoryFilter() {
        const filter = document.getElementById('categoryFilter');
        Object.keys(labTestDefinitions).forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = labTestDefinitions[key].name;
            filter.appendChild(option);
        });
    }

    function renderTestCategories() {
        const accordion = document.getElementById('labCategoriesAccordion');
        accordion.innerHTML = '';

        Object.keys(labTestDefinitions).forEach((categoryKey, index) => {
            const category = labTestDefinitions[categoryKey];
            const categoryEl = document.createElement('div');
            categoryEl.className = 'lab-category';
            categoryEl.dataset.category = categoryKey;

            categoryEl.innerHTML = `
                <div class="lab-category-header" data-toggle="${categoryKey}">
                    <div class="category-title">
                        <i data-lucide="${category.icon}"></i>
                        <span>${category.name}</span>
                        <span class="test-count">${category.tests.length} tests</span>
                    </div>
                    <i data-lucide="chevron-down" class="toggle-icon"></i>
                </div>
                <div class="lab-category-content" id="content-${categoryKey}">
                    <table class="lab-tests-table">
                        <thead>
                            <tr>
                                <th class="col-select"></th>
                                <th class="col-test">Test Name</th>
                                <th class="col-result">Result</th>
                                <th class="col-unit">Unit</th>
                                <th class="col-reference">Reference Range</th>
                                <th class="col-flag">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${category.tests.map(test => renderTestRow(categoryKey, test)).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            accordion.appendChild(categoryEl);
        });

        lucide.createIcons();
    }

    function renderTestRow(categoryKey, test) {
        return `
            <tr class="test-row" data-test-id="${test.id}">
                <td class="col-select">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" class="test-checkbox" data-category="${categoryKey}" data-test-id="${test.id}">
                        <span class="checkmark"></span>
                    </label>
                </td>
                <td class="col-test">${test.name}</td>
                <td class="col-result">
                    <input type="${test.type === 'numeric' ? 'number' : 'text'}" 
                           class="form-control result-input" 
                           data-test-id="${test.id}"
                           data-type="${test.type}"
                           placeholder="Enter result"
                           step="any"
                           disabled>
                </td>
                <td class="col-unit">
                    <input type="text" class="form-control unit-input" value="${test.unit}" data-test-id="${test.id}">
                </td>
                <td class="col-reference">
                    <span class="reference-range">${test.reference}</span>
                </td>
                <td class="col-flag">
                    <select class="form-control flag-select" data-test-id="${test.id}" disabled>
                        <option value="">--</option>
                        <option value="low">Low</option>
                        <option value="normal">Normal</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </td>
            </tr>
        `;
    }

    function bindEvents() {
        // Patient selection
        document.getElementById('patientSelect').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            document.getElementById('patientId').value = selectedOption.dataset.id || '';
        });

        // Category filter
        document.getElementById('categoryFilter').addEventListener('change', function() {
            const value = this.value;
            document.querySelectorAll('.lab-category').forEach(cat => {
                if (value === 'all' || cat.dataset.category === value) {
                    cat.style.display = 'block';
                } else {
                    cat.style.display = 'none';
                }
            });
        });

        // Category accordion toggle
        document.addEventListener('click', function(e) {
            const header = e.target.closest('.lab-category-header');
            if (header) {
                const category = header.closest('.lab-category');
                category.classList.toggle('open');
            }
        });

        // Test checkbox toggle
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('test-checkbox')) {
                const row = e.target.closest('.test-row');
                const resultInput = row.querySelector('.result-input');
                const flagSelect = row.querySelector('.flag-select');
                
                if (e.target.checked) {
                    resultInput.disabled = false;
                    flagSelect.disabled = false;
                    row.classList.add('selected');
                } else {
                    resultInput.disabled = true;
                    resultInput.value = '';
                    flagSelect.disabled = true;
                    flagSelect.value = '';
                    row.classList.remove('selected');
                }
            }
        });

        // Add custom test
        document.getElementById('addCustomTestBtn').addEventListener('click', addCustomTest);

        // Remove custom test
        document.addEventListener('click', function(e) {
            if (e.target.closest('.remove-custom-test')) {
                const row = e.target.closest('.custom-test-row');
                row.remove();
                customTestCount--;
                toggleEmptyState();
            }
        });

        // Form submission
        document.getElementById('submitResultsBtn').addEventListener('click', submitResults);
        document.getElementById('saveDraftBtn').addEventListener('click', saveDraft);
        document.getElementById('cancelBtn').addEventListener('click', cancelEntry);
    }

    function addCustomTest() {
        const template = document.getElementById('customTestTemplate');
        const container = document.getElementById('customTestsContainer');
        const emptyState = document.getElementById('noCustomTests');
        
        if (emptyState) emptyState.style.display = 'none';
        
        const clone = template.content.cloneNode(true);
        container.appendChild(clone);
        customTestCount++;
        
        lucide.createIcons();
    }

    function toggleEmptyState() {
        const emptyState = document.getElementById('noCustomTests');
        if (emptyState) {
            emptyState.style.display = customTestCount === 0 ? 'flex' : 'none';
        }
    }

    function collectFormData() {
        const patientId = document.getElementById('patientId').value;
        const patientName = document.getElementById('patientSelect').options[document.getElementById('patientSelect').selectedIndex].text;
        const sampleDate = document.getElementById('sampleDate').value;
        const entryDate = document.getElementById('entryDate').value;
        const clinicalNotes = document.getElementById('clinicalNotes').value;

        // Collect selected predefined tests
        const predefinedTests = [];
        document.querySelectorAll('.test-checkbox:checked').forEach(checkbox => {
            const row = checkbox.closest('.test-row');
            const testId = checkbox.dataset.testId;
            const category = checkbox.dataset.category;
            const testDef = labTestDefinitions[category].tests.find(t => t.id === testId);
            
            predefinedTests.push({
                testId: testId,
                category: category,
                name: testDef.name,
                result: row.querySelector('.result-input').value,
                unit: row.querySelector('.unit-input').value,
                reference: testDef.reference,
                flag: row.querySelector('.flag-select').value
            });
        });

        // Collect custom tests
        const customTests = [];
        document.querySelectorAll('.custom-test-row').forEach(row => {
            customTests.push({
                name: row.querySelector('.custom-test-name').value,
                parameter: row.querySelector('.custom-parameter').value,
                result: row.querySelector('.custom-result').value,
                unit: row.querySelector('.custom-unit').value,
                reference: row.querySelector('.custom-reference').value,
                notes: row.querySelector('.custom-notes').value
            });
        });

        return {
            patientId,
            patientName,
            sampleDate,
            entryDate,
            predefinedTests,
            customTests,
            clinicalNotes
        };
    }

    function validateForm() {
        const patientId = document.getElementById('patientId').value;
        const sampleDate = document.getElementById('sampleDate').value;
        
        if (!patientId) {
            alert('Please select a patient.');
            return false;
        }
        if (!sampleDate) {
            alert('Please enter the sample collection date.');
            return false;
        }

        // Check if at least one test is selected
        const hasTests = document.querySelectorAll('.test-checkbox:checked').length > 0 || 
                         document.querySelectorAll('.custom-test-row').length > 0;
        
        if (!hasTests) {
            alert('Please select at least one test or add a custom test.');
            return false;
        }

        return true;
    }

    function submitResults() {
        if (!validateForm()) return;
        
        const data = collectFormData();
        console.log('Submitting lab results:', data);
        
        // Here you would send to your backend
        alert('Lab results submitted successfully!');
    }

    function saveDraft() {
        const data = collectFormData();
        console.log('Saving draft:', data);
        alert('Draft saved successfully!');
    }

    function cancelEntry() {
        if (confirm('Are you sure you want to cancel? All unsaved changes will be lost.')) {
            // Navigate back or reset form
            location.reload();
        }
    }

    // Initialize on load
    init();
})();
</script>
