<!-- Hospital Pharmacy Section -->
<div class="welcome-section">
    <div class="welcome-text">
        <h1>Pharmacy</h1>
        <p>Prescription dispensing, drug inventory, and pharmacy operations</p>
    </div>
</div>

<!-- Stats -->
<div class="stats-grid" style="margin-bottom:1.5rem;">
    <div class="stat-card gradient-primary">
        <i data-lucide="pill" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Prescriptions Today</p><h3 class="stat-value">34</h3></div>
    </div>
    <div class="stat-card gradient-warning">
        <i data-lucide="clock" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Awaiting Dispensing</p><h3 class="stat-value">7</h3></div>
    </div>
    <div class="stat-card gradient-success">
        <i data-lucide="check-circle" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Dispensed</p><h3 class="stat-value">27</h3></div>
    </div>
    <div class="stat-card gradient-info">
        <i data-lucide="alert-triangle" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Low Stock Items</p><h3 class="stat-value">4</h3></div>
    </div>
</div>

<!-- Tabs -->
<div class="emr-tabs" style="margin-bottom:1.25rem;">
    <button class="emr-tab active" onclick="filterPharmacyTab('pending', this)">Pending Prescriptions</button>
    <button class="emr-tab" onclick="filterPharmacyTab('dispensed', this)">Dispensed</button>
    <button class="emr-tab" onclick="filterPharmacyTab('inventory', this)">Drug Inventory</button>
    <button class="emr-tab" onclick="filterPharmacyTab('low_stock', this)">Low Stock Alerts</button>
</div>

<!-- Content -->
<div id="pharmacyContent">
    <div style="overflow-x:auto;">
        <table class="queue-table">
            <thead><tr><th>Rx #</th><th>Patient</th><th>Drug</th><th>Dosage</th><th>Qty</th><th>Prescribed By</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="rxBody"><tr><td colspan="9" style="text-align:center;padding:2rem;">Loading...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
let allPrescriptions = [];
let allLowStock = [];
let allInventory = [];
let currentPharmacyTab = 'pending';

async function loadPharmacy() {
    try {
        const res = await fetch('/api/hospital/pharmacy', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            const s = data.stats || {};
            document.querySelectorAll('.stat-value')[0].textContent = s.total_prescriptions || 0;
            document.querySelectorAll('.stat-value')[1].textContent = s.pending || 0;
            document.querySelectorAll('.stat-value')[2].textContent = s.dispensed || 0;
            document.querySelectorAll('.stat-value')[3].textContent = s.low_stock_count || 0;
            allPrescriptions = data.prescriptions || [];
            allLowStock = data.low_stock || [];
            allInventory = data.inventory || [];
            renderPharmacyTab();
        }
    } catch(e) { console.error('Pharmacy error:', e); }
}

function renderPharmacyTab() {
    const container = document.getElementById('pharmacyContent');
    if (currentPharmacyTab === 'pending') {
        const rx = allPrescriptions.filter(r => !r.dispensing_id);
        container.innerHTML = renderRxTable(rx);
    } else if (currentPharmacyTab === 'dispensed') {
        const rx = allPrescriptions.filter(r => r.dispensing_id);
        container.innerHTML = renderRxTable(rx);
    } else if (currentPharmacyTab === 'inventory') {
        container.innerHTML = `<div style="overflow-x:auto;"><table class="queue-table">
            <thead><tr><th>Drug Name</th><th>Strength</th><th>Form</th><th>In Stock</th><th>Reorder Level</th><th>Status</th></tr></thead>
            <tbody>${allInventory.length ? allInventory.map(i => `<tr>
                <td><strong>${i.drug_name}</strong></td><td>${i.strength||'—'}</td><td>${i.form||'—'}</td>
                <td>${i.quantity_in_stock}</td><td>${i.reorder_level}</td>
                <td><span class="queue-status ${i.quantity_in_stock<=i.reorder_level?'status-waiting':'status-completed'}">${i.quantity_in_stock<=i.reorder_level?'Low Stock':'In Stock'}</span></td>
            </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;padding:2rem;">No inventory data</td></tr>'}</tbody>
        </table></div>`;
    } else {
        container.innerHTML = `<div class="billing-mini-list">${allLowStock.length ? allLowStock.map(l => `<div class="billing-mini-item">
            <div class="billing-mini-info"><h4>${l.drug_name} ${l.strength||''}</h4><p>Remaining: ${l.quantity_in_stock} — Reorder level: ${l.reorder_level}</p></div>
            <button class="btn btn-sm btn-primary">Reorder</button>
        </div>`).join('') : '<p style="padding:2rem;text-align:center;color:var(--muted-foreground);">No low stock alerts</p>'}</div>`;
    }
}

function renderRxTable(rx) {
    return `<div style="overflow-x:auto;"><table class="queue-table">
        <thead><tr><th>Rx #</th><th>Patient</th><th>Drug</th><th>Dosage</th><th>Qty</th><th>Prescribed By</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rx.length ? rx.map(r => `<tr>
            <td><strong>RX-${r.prescription_id}</strong></td>
            <td><strong>${r.patient_name}</strong></td>
            <td>${r.drug_name}</td><td>${r.dosage}</td><td>${r.quantity||'—'}</td>
            <td>${r.doctor_name}</td>
            <td><span class="status-badge ${r.dispense_payment_status==='paid'?'paid-badge':'pending'}">${r.dispense_payment_status||'—'}</span></td>
            <td><span class="queue-status ${r.dispensing_id?'status-checked-in':'status-waiting'}">${r.dispensing_id?'Dispensed':'Pending'}</span></td>
            <td>${!r.dispensing_id ? `<button class="btn btn-sm btn-primary" onclick="dispense(${r.prescription_id},${r.patient_id},'${r.drug_name}','${r.dosage}',${r.quantity||1})">Dispense</button>` : '<button class="btn btn-sm btn-outline">Done</button>'}</td>
        </tr>`).join('') : '<tr><td colspan="9" style="text-align:center;padding:2rem;">No prescriptions</td></tr>'}</tbody>
    </table></div>`;
}

function filterPharmacyTab(tab, btn) {
    currentPharmacyTab = tab;
    document.querySelectorAll('.emr-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderPharmacyTab();
}

async function dispense(rxId, patientId, drugName, dosage, qty) {
    try {
        const res = await fetch('/api/hospital/pharmacy/dispense', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prescription_id: rxId, patient_id: patientId, drug_name: drugName, dosage, quantity_dispensed: qty, payment_status: 'paid' })
        });
        if ((await res.json()).success) loadPharmacy();
    } catch(e) { console.error('Dispense error:', e); }
}

loadPharmacy();
</script>
