<!-- Hospital Laboratory Section -->
<div class="welcome-section">
    <div class="welcome-text">
        <h1>Laboratory</h1>
        <p>Test orders, results management, sample tracking, and lab analytics</p>
    </div>
</div>

<!-- Stats -->
<div class="stats-grid" style="margin-bottom:1.5rem;">
    <div class="stat-card gradient-primary">
        <i data-lucide="microscope" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Tests Today</p><h3 class="stat-value">26</h3></div>
    </div>
    <div class="stat-card gradient-warning">
        <i data-lucide="clock" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Pending</p><h3 class="stat-value">8</h3></div>
    </div>
    <div class="stat-card gradient-info">
        <i data-lucide="flask-conical" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">In Progress</p><h3 class="stat-value">5</h3></div>
    </div>
    <div class="stat-card gradient-success">
        <i data-lucide="check-circle" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Completed</p><h3 class="stat-value">13</h3></div>
    </div>
</div>

<!-- Tabs -->
<div class="emr-tabs" style="margin-bottom:1.25rem;">
    <button class="emr-tab active" onclick="filterLabTab('pending', this)">Pending Orders</button>
    <button class="emr-tab" onclick="filterLabTab('in_progress', this)">In Progress</button>
    <button class="emr-tab" onclick="filterLabTab('completed', this)">Completed</button>
    <button class="emr-tab" onclick="filterLabTab('sample', this)">Sample Tracking</button>
    <button class="emr-tab" onclick="filterLabTab('categories', this)">Categories</button>
</div>

<!-- Orders Table -->
<div style="overflow-x:auto;">
    <table class="queue-table">
        <thead><tr><th>Order #</th><th>Patient</th><th>Test(s)</th><th>Category</th><th>Sample</th><th>Priority</th><th>Ordered By</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="labBody"><tr><td colspan="9" style="text-align:center;padding:2rem;">Loading...</td></tr></tbody>
    </table>
</div>

<script>
let allLabOrders = [];
let currentLabFilter = 'pending';

async function loadLab() {
    try {
        const res = await fetch('/api/hospital/lab', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            const s = data.stats || {};
            document.querySelectorAll('.stat-value')[0].textContent = s.today || 0;
            document.querySelectorAll('.stat-value')[1].textContent = s.pending || 0;
            document.querySelectorAll('.stat-value')[2].textContent = s.in_progress || 0;
            document.querySelectorAll('.stat-value')[3].textContent = s.completed || 0;
            allLabOrders = data.orders || [];
            renderLabOrders();
        }
    } catch(e) { console.error('Lab error:', e); }
}

function renderLabOrders() {
    const tbody = document.getElementById('labBody');
    let filtered = allLabOrders;
    if (currentLabFilter === 'pending') filtered = allLabOrders.filter(o => o.status === 'pending' || o.status === 'ordered');
    else if (currentLabFilter === 'in_progress') filtered = allLabOrders.filter(o => o.status === 'in_progress' || o.status === 'processing');
    else if (currentLabFilter === 'completed') filtered = allLabOrders.filter(o => o.status === 'final' || o.status === 'completed');

    tbody.innerHTML = filtered.length ? filtered.map(o => `<tr>
        <td><strong>LAB-${o.result_id}</strong></td>
        <td><strong>${o.patient_name}</strong></td>
        <td>${(o.tests||[]).map(t=>t.test_name).join(', ') || '—'}</td>
        <td>${(o.tests||[])[0]?.category_name || '—'}</td>
        <td>${(o.tests||[])[0]?.sample_type || '—'}</td>
        <td>—</td>
        <td>${o.ordered_by_name || '—'}</td>
        <td><span class="queue-status ${o.status==='final'||o.status==='completed'?'status-completed':'status-waiting'}">${o.status}</span></td>
        <td><button class="btn btn-sm btn-outline">View</button></td>
    </tr>`).join('') : '<tr><td colspan="9" style="text-align:center;padding:2rem;">No lab orders</td></tr>';
}

function filterLabTab(filter, btn) {
    currentLabFilter = filter;
    document.querySelectorAll('.emr-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderLabOrders();
}

loadLab();
</script>
