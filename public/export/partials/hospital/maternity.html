<!-- Hospital Maternity Section -->
<div class="welcome-section">
    <div class="welcome-text">
        <h1>Maternity Ward</h1>
        <p>Antenatal care, deliveries, postnatal follow-ups, and birth records</p>
    </div>
</div>

<!-- Stats -->
<div class="stats-grid" style="margin-bottom:1.5rem;">
    <div class="stat-card gradient-primary">
        <i data-lucide="baby" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Active ANC Patients</p><h3 class="stat-value">34</h3></div>
    </div>
    <div class="stat-card gradient-success">
        <i data-lucide="heart" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Deliveries This Month</p><h3 class="stat-value">12</h3></div>
    </div>
    <div class="stat-card gradient-warning">
        <i data-lucide="alert-triangle" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">High-Risk</p><h3 class="stat-value">5</h3></div>
    </div>
    <div class="stat-card gradient-info">
        <i data-lucide="calendar-check" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Postnatal Follow-ups</p><h3 class="stat-value">8</h3></div>
    </div>
</div>

<!-- Tabs -->
<div class="emr-tabs" style="margin-bottom:1.25rem;">
    <button class="emr-tab active">ANC Register</button>
    <button class="emr-tab">Delivery Log</button>
    <button class="emr-tab">Postnatal</button>
    <button class="emr-tab">Birth Records</button>
</div>

<!-- ANC Table -->
<div style="overflow-x:auto;">
    <table class="queue-table">
        <thead><tr><th>Patient</th><th>Gestational Age</th><th>EDD</th><th>Risk Level</th><th>Next Visit</th><th>Assigned Doctor</th><th>Actions</th></tr></thead>
        <tbody>
            <!-- Populated by JS -->
        </tbody>
    </table>
</div>

<script>
async function loadMaternity() {
    try {
        const res = await fetch('/api/hospital/maternity', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            const s = data.stats || {};
            document.querySelectorAll('.stat-value')[0].textContent = s.active_anc || 0;
            document.querySelectorAll('.stat-value')[1].textContent = s.delivered_this_month || 0;
            document.querySelectorAll('.stat-value')[2].textContent = s.high_risk || 0;
            document.querySelectorAll('.stat-value')[3].textContent = s.postnatal || 0;

            const tbody = document.querySelector('tbody');
            const records = data.records || [];
            tbody.innerHTML = records.length ? records.map(r => `<tr>
                <td><div style="display:flex;align-items:center;gap:0.75rem;"><div class="avatar" style="width:32px;height:32px;font-size:0.7rem;">${(r.patient_name||'??').split(' ').map(n=>n[0]).join('')}</div><div><strong>${r.patient_name}</strong></div></div></td>
                <td><strong>${r.gestational_age_weeks || '?'} weeks</strong></td>
                <td>${r.edd ? new Date(r.edd).toLocaleDateString() : '—'}</td>
                <td><span style="color:${r.risk_level==='high'?'var(--destructive)':'var(--success)'};font-weight:600;">${(r.risk_level||'low').charAt(0).toUpperCase()+(r.risk_level||'low').slice(1)}</span></td>
                <td>—</td>
                <td>${r.doctor_name || '—'}</td>
                <td><button class="btn btn-sm btn-outline">View</button></td>
            </tr>`).join('') : '<tr><td colspan="7" style="text-align:center;padding:2rem;">No maternity records</td></tr>';
        }
    } catch(e) { console.error('Maternity error:', e); }
}
loadMaternity();
</script>
