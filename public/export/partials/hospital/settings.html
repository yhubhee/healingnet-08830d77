<!-- Hospital Settings Partial -->
<div class="welcome-section">
    <div class="welcome-text"><h1>Hospital Settings</h1><p>Manage your hospital profile, staff, departments, and notification preferences</p></div>
</div>

<div class="queue-filters" style="margin-bottom:1.5rem;">
    <button class="queue-filter-btn active" onclick="showSettingsTab('profile', this)">Hospital Profile</button>
    <button class="queue-filter-btn" onclick="showSettingsTab('staff', this)">Staff Roles</button>
    <button class="queue-filter-btn" onclick="showSettingsTab('departments', this)">Departments</button>
    <button class="queue-filter-btn" onclick="showSettingsTab('notifications', this)">Notifications</button>
</div>

<!-- ========== Tab 1: Hospital Profile ========== -->
<div class="tab-panel" id="tab-profile">
    <div class="card" style="padding:1.5rem;">
        <h2 style="margin-bottom:1rem;font-size:1.1rem;">Hospital Profile</h2>
        <form id="profileForm" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group"><label>Hospital Name</label><input type="text" id="profName" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="profEmail" required></div>
            <div class="form-group"><label>Phone</label><input type="text" id="profPhone"></div>
            <div class="form-group"><label>Website</label><input type="url" id="profWebsite" placeholder="https://..."></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Address</label><input type="text" id="profAddress"></div>
            <div class="form-group"><label>Logo URL</label><input type="url" id="profLogo" placeholder="https://..."></div>
            <div class="form-group"><label>Operating Hours</label><input type="text" id="profHours" placeholder="Mon-Fri 8am-6pm"></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Description</label><textarea id="profDesc" rows="3" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.75rem;color:var(--foreground);resize:vertical;"></textarea></div>
            <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:0.5rem;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- ========== Tab 2: Staff Roles ========== -->
<div class="tab-panel" id="tab-staff" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h2 style="font-size:1.1rem;">Staff Members</h2>
        <button class="btn btn-primary" onclick="document.getElementById('addStaffModal').classList.add('show')"><i data-lucide="user-plus"></i> Add Staff</button>
    </div>
    <div class="card" style="overflow-x:auto;">
        <table class="data-table" id="staffTable">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="staffBody"><tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--muted-foreground);">Loading...</td></tr></tbody>
        </table>
    </div>

    <!-- Add Staff Modal -->
    <div class="modal-overlay" id="addStaffModal">
        <div class="modal-content">
            <h2><i data-lucide="user-plus" style="width:20px;height:20px;display:inline;"></i> Add Staff Member</h2>
            <form id="addStaffForm">
                <div class="form-group"><label>First Name</label><input type="text" id="staffFirstName" required></div>
                <div class="form-group"><label>Last Name</label><input type="text" id="staffLastName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="staffEmail" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="staffPassword" required minlength="6"></div>
                <div class="form-group"><label>Phone</label><input type="text" id="staffPhone"></div>
                <div class="form-group"><label>Role</label>
                    <select id="staffRole">
                        <option value="receptionist">Receptionist</option>
                        <option value="nurse">Nurse</option>
                        <option value="lab_tech">Lab Technician</option>
                        <option value="pharmacist">Pharmacist</option>
                        <option value="medical_officer">Medical Officer</option>
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group"><label>Department</label><input type="text" id="staffDept" placeholder="e.g., Radiology"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('addStaffModal').classList.remove('show')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Staff</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ========== Tab 3: Departments ========== -->
<div class="tab-panel" id="tab-departments" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h2 style="font-size:1.1rem;">Departments</h2>
        <div style="display:flex;gap:0.5rem;">
            <input type="text" id="newDeptName" placeholder="New department name" style="padding:0.5rem 0.75rem;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--foreground);">
            <button class="btn btn-primary" onclick="addDepartment()">Add</button>
        </div>
    </div>
    <div class="card" style="overflow-x:auto;">
        <table class="data-table">
            <thead><tr><th>Department</th><th>Staff</th><th>Doctors</th><th>Total</th></tr></thead>
            <tbody id="deptBody"><tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--muted-foreground);">Loading...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- ========== Tab 4: Notification Preferences ========== -->
<div class="tab-panel" id="tab-notifications" style="display:none;">
    <div class="card" style="padding:1.5rem;">
        <h2 style="margin-bottom:1rem;font-size:1.1rem;">Notification Preferences</h2>
        <div id="notifPrefs" style="display:flex;flex-direction:column;gap:1rem;">
            <p style="color:var(--muted-foreground);">Loading...</p>
        </div>
        <div style="margin-top:1.5rem;display:flex;justify-content:flex-end;">
            <button class="btn btn-primary" onclick="saveNotifPrefs()">Save Preferences</button>
        </div>
    </div>
</div>

<script>
// ---- Tab switching ----
function showSettingsTab(tab, btn) {
    document.querySelectorAll('.queue-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
    const target = document.getElementById('tab-' + tab);
    if (target) target.style.display = '';
}

// ---- Profile ----
async function loadProfile() {
    try {
        const res = await fetch('/api/hospital/settings/profile', { credentials: 'include' });
        const data = await res.json();
        if (data.success && data.hospital) {
            const h = data.hospital;
            document.getElementById('profName').value = h.name || '';
            document.getElementById('profEmail').value = h.email || '';
            document.getElementById('profPhone').value = h.phone || '';
            document.getElementById('profAddress').value = h.address || '';
            document.getElementById('profLogo').value = h.logo_url || '';
            document.getElementById('profWebsite').value = h.website || '';
            document.getElementById('profHours').value = h.operating_hours || '';
            document.getElementById('profDesc').value = h.description || '';
        }
    } catch (err) { console.error('Load profile error:', err); }
}

document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await fetch('/api/hospital/settings/profile', {
            method: 'PUT', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('profName').value,
                email: document.getElementById('profEmail').value,
                phone: document.getElementById('profPhone').value,
                address: document.getElementById('profAddress').value,
                logo_url: document.getElementById('profLogo').value,
                website: document.getElementById('profWebsite').value,
                operating_hours: document.getElementById('profHours').value,
                description: document.getElementById('profDesc').value,
            })
        });
        const data = await res.json();
        alert(data.success ? 'Profile updated!' : (data.message || 'Error updating profile'));
    } catch (err) { console.error('Save profile error:', err); }
});

// ---- Staff ----
async function loadStaff() {
    try {
        const res = await fetch('/api/hospital/settings/staff', { credentials: 'include' });
        const data = await res.json();
        if (data.success) renderStaff(data.staff || []);
    } catch (err) { console.error('Load staff error:', err); }
}

function renderStaff(staff) {
    const tbody = document.getElementById('staffBody');
    if (!staff.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--muted-foreground);">No staff members found</td></tr>'; return; }

    const roles = ['admin','receptionist','nurse','lab_tech','pharmacist','manager','medical_officer'];
    tbody.innerHTML = staff.map(s => {
        const roleOpts = roles.map(r => `<option value="${r}" ${s.role===r?'selected':''}>${r.replace('_',' ')}</option>`).join('');
        const statusClass = s.is_active ? 'status-active' : 'status-inactive';
        const statusLabel = s.is_active ? 'Active' : 'Inactive';
        return `<tr>
            <td>${s.first_name} ${s.last_name}</td>
            <td>${s.email}</td>
            <td><select onchange="changeStaffRole(${s.id}, this.value)" style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.5rem;color:var(--foreground);font-size:0.85rem;">${roleOpts}</select></td>
            <td>${s.department || '—'}</td>
            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
            <td><button class="btn btn-outline btn-sm" onclick="toggleStaffStatus(${s.id}, ${s.is_active ? 'false' : 'true'})">${s.is_active ? 'Deactivate' : 'Activate'}</button></td>
        </tr>`;
    }).join('');
}

async function changeStaffRole(id, role) {
    try {
        const res = await fetch(`/api/hospital/settings/staff/${id}/role`, {
            method: 'PUT', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role })
        });
        const data = await res.json();
        if (!data.success) alert(data.message || 'Error');
    } catch (err) { console.error('Change role error:', err); }
}

async function toggleStaffStatus(id, activate) {
    try {
        const res = await fetch(`/api/hospital/settings/staff/${id}/status`, {
            method: 'PUT', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_active: activate })
        });
        const data = await res.json();
        if (data.success) loadStaff();
    } catch (err) { console.error('Toggle status error:', err); }
}

document.getElementById('addStaffForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await fetch('/api/hospital/settings/staff', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                first_name: document.getElementById('staffFirstName').value,
                last_name: document.getElementById('staffLastName').value,
                email: document.getElementById('staffEmail').value,
                password: document.getElementById('staffPassword').value,
                phone: document.getElementById('staffPhone').value,
                role: document.getElementById('staffRole').value,
                department: document.getElementById('staffDept').value,
            })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('addStaffModal').classList.remove('show');
            document.getElementById('addStaffForm').reset();
            loadStaff();
        } else alert(data.message || 'Error adding staff');
    } catch (err) { console.error('Add staff error:', err); }
});

// ---- Departments ----
async function loadDepartments() {
    try {
        const res = await fetch('/api/hospital/settings/departments', { credentials: 'include' });
        const data = await res.json();
        if (data.success) renderDepartments(data.departments || []);
    } catch (err) { console.error('Load departments error:', err); }
}

function renderDepartments(depts) {
    const tbody = document.getElementById('deptBody');
    if (!depts.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--muted-foreground);">No departments found</td></tr>'; return; }
    tbody.innerHTML = depts.map(d => `<tr>
        <td>${d.name}</td>
        <td>${d.staff_count}</td>
        <td>${d.doctor_count}</td>
        <td>${d.staff_count + d.doctor_count}</td>
    </tr>`).join('');
}

function addDepartment() {
    const name = document.getElementById('newDeptName').value.trim();
    if (!name) { alert('Enter a department name'); return; }
    alert('To add a department, assign it to a staff member or doctor. The department list is derived from staff/doctor assignments.');
    document.getElementById('newDeptName').value = '';
}

// ---- Notification Preferences ----
let notifData = [];
async function loadNotifPrefs() {
    try {
        const res = await fetch('/api/hospital/settings/notifications', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            notifData = data.preferences || [];
            renderNotifPrefs();
        }
    } catch (err) { console.error('Load notif prefs error:', err); }
}

function renderNotifPrefs() {
    const container = document.getElementById('notifPrefs');
    container.innerHTML = notifData.map((p, i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:8px;">
            <span>${p.label}</span>
            <label class="toggle-switch">
                <input type="checkbox" data-idx="${i}" ${p.enabled ? 'checked' : ''} onchange="notifData[${i}].enabled = this.checked">
                <span class="toggle-slider"></span>
            </label>
        </div>
    `).join('');
}

async function saveNotifPrefs() {
    try {
        const prefs = notifData.map(p => ({ key: p.key, enabled: p.enabled }));
        const res = await fetch('/api/hospital/settings/notifications', {
            method: 'PUT', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ preferences: prefs })
        });
        const data = await res.json();
        alert(data.success ? 'Preferences saved!' : (data.message || 'Error'));
    } catch (err) { console.error('Save prefs error:', err); }
}

// ---- Init ----
loadProfile();
loadStaff();
loadDepartments();
loadNotifPrefs();
</script>

<style>
.toggle-switch { position:relative;display:inline-block;width:44px;height:24px; }
.toggle-switch input { opacity:0;width:0;height:0; }
.toggle-slider { position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:24px;transition:.3s; }
.toggle-slider:before { content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--foreground);border-radius:50%;transition:.3s; }
.toggle-switch input:checked + .toggle-slider { background:var(--primary, #10b981); }
.toggle-switch input:checked + .toggle-slider:before { transform:translateX(20px); }
</style>
