<!-- Patient Full Details View -->
<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem;">
    <button class="btn btn-sm btn-outline" onclick="fetch('/export/partials/hospital/patients-list.html').then(r=>r.text()).then(h=>{document.querySelector('.main-content').innerHTML=h;lucide.createIcons();})">
        <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Back to Patients
    </button>
</div>

<!-- Patient Header -->
<div class="emr-patient-header" style="margin-bottom:1.5rem;" id="patientHeader">
    <div class="avatar" style="width:72px;height:72px;font-size:1.5rem;" id="patientAvatar">—</div>
    <div class="emr-patient-info" style="flex:1;">
        <h2 id="patientName">Loading...</h2>
        <div class="patient-meta" id="patientMeta"></div>
    </div>
</div>

<!-- Detail Tabs -->
<div class="emr-tabs" style="margin-bottom:1.5rem;">
    <button class="emr-tab active" onclick="showPatientTab('overview', this)">Overview</button>
    <button class="emr-tab" onclick="showPatientTab('medical', this)">Medical History</button>
    <button class="emr-tab" onclick="showPatientTab('visits', this)">Visits & EMR</button>
    <button class="emr-tab" onclick="showPatientTab('prescriptions', this)">Prescriptions</button>
    <button class="emr-tab" onclick="showPatientTab('lab', this)">Lab Results</button>
    <button class="emr-tab" onclick="showPatientTab('billing', this)">Billing</button>
    <button class="emr-tab" onclick="showPatientTab('insurance', this)">Insurance</button>
    <button class="emr-tab" onclick="showPatientTab('referrals', this)">Referrals</button>
</div>

<div id="tab-overview" class="patient-tab-content"><p style="color:var(--muted-foreground);padding:2rem;text-align:center;">Loading patient data...</p></div>
<div id="tab-medical" class="patient-tab-content" style="display:none;"></div>
<div id="tab-visits" class="patient-tab-content" style="display:none;"></div>
<div id="tab-prescriptions" class="patient-tab-content" style="display:none;"></div>
<div id="tab-lab" class="patient-tab-content" style="display:none;"></div>
<div id="tab-billing" class="patient-tab-content" style="display:none;"></div>
<div id="tab-insurance" class="patient-tab-content" style="display:none;"></div>
<div id="tab-referrals" class="patient-tab-content" style="display:none;"></div>

<script>
function showPatientTab(tab, btn) {
    document.querySelectorAll('.patient-tab-content').forEach(el => el.style.display = 'none');
    document.getElementById('tab-' + tab).style.display = 'block';
    document.querySelectorAll('.emr-tab').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
}

async function loadPatientData(patientId) {
    if (!patientId) return;
    try {
        const res = await fetch(`/api/hospital/patients/${patientId}`, { credentials: 'include' });
        const data = await res.json();
        if (!data.success) return;

        const p = data.patient;
        const initials = ((p.firstname||'')[0]||'') + ((p.lastname||'')[0]||'');
        const age = p.date_of_birth ? Math.floor((Date.now() - new Date(p.date_of_birth)) / 31557600000) : '?';

        document.getElementById('patientAvatar').textContent = initials;
        document.getElementById('patientName').textContent = `${p.firstname} ${p.lastname}`;
        document.getElementById('patientMeta').innerHTML = `
            <span><i data-lucide="user" style="width:14px;height:14px;"></i> ${p.gender || '?'} • ${age} yrs</span>
            <span><i data-lucide="droplet" style="width:14px;height:14px;"></i> ${p.blood_type || '?'} / ${p.genotype || '?'}</span>
            <span><i data-lucide="phone" style="width:14px;height:14px;"></i> ${p.phone || '—'}</span>
            <span><i data-lucide="mail" style="width:14px;height:14px;"></i> ${p.email || '—'}</span>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();

        // Overview
        document.getElementById('tab-overview').innerHTML = `<div class="content-grid">
            <div class="content-section"><div class="section-header"><h2>Personal Information</h2></div><div class="detail-grid">
                <div class="detail-row"><span class="detail-label">Full Name</span><span>${p.firstname} ${p.lastname}</span></div>
                <div class="detail-row"><span class="detail-label">Date of Birth</span><span>${p.date_of_birth ? new Date(p.date_of_birth).toLocaleDateString() : '—'}</span></div>
                <div class="detail-row"><span class="detail-label">Gender</span><span>${p.gender || '—'}</span></div>
                <div class="detail-row"><span class="detail-label">Address</span><span>${p.address || '—'}</span></div>
                <div class="detail-row"><span class="detail-label">National ID</span><span>${p.national_id || '—'}</span></div>
                <div class="detail-row"><span class="detail-label">Status</span><span class="queue-status status-checked-in">${p.status || 'Active'}</span></div>
            </div></div>
            <div class="content-section"><div class="section-header"><h2>Plan & Insurance</h2></div><div class="detail-grid">
                <div class="detail-row"><span class="detail-label">Organization</span><span>${p.organization_id ? 'Org ID: ' + p.organization_id : 'Individual'}</span></div>
                <div class="detail-row"><span class="detail-label">Insurance</span><span>${p.insurance_provider || 'None'}</span></div>
                <div class="detail-row"><span class="detail-label">Policy #</span><span>${p.insurance_number || '—'}</span></div>
                <div class="detail-row"><span class="detail-label">Emergency Contact</span><span>${p.emergency_contact_name || '—'} (${p.emergency_contact_phone || '—'})</span></div>
            </div></div>
        </div>`;

        // Medical
        document.getElementById('tab-medical').innerHTML = `<div class="content-section"><div class="section-header"><h2>Conditions & Allergies</h2></div><div class="detail-grid">
            <div class="detail-row"><span class="detail-label">Medical Conditions</span><span>${p.medical_conditions || 'None recorded'}</span></div>
            <div class="detail-row"><span class="detail-label">Chronic Conditions</span><span>${p.chronic_conditions || 'None'}</span></div>
            <div class="detail-row"><span class="detail-label">Allergies</span><span>${p.allergies || 'None recorded'}</span></div>
            <div class="detail-row"><span class="detail-label">Current Medications</span><span>${p.medications || 'None'}</span></div>
            <div class="detail-row"><span class="detail-label">Surgical History</span><span>${p.surgical_history || 'None'}</span></div>
            <div class="detail-row"><span class="detail-label">Family History</span><span>${p.family_medical_history || 'None'}</span></div>
            <div class="detail-row"><span class="detail-label">Blood Type</span><span>${p.blood_type || '?'}</span></div>
            <div class="detail-row"><span class="detail-label">Genotype</span><span>${p.genotype || '?'}</span></div>
        </div></div>`;

        // Visits/EMR
        const emr = data.emr_entries || [];
        document.getElementById('tab-visits').innerHTML = `<div class="content-section"><div class="section-header"><h2>Visit History (${emr.length})</h2></div>
            ${emr.length ? emr.map(e => `<div class="emr-entry"><div class="emr-entry-header"><div><h4>${e.title}</h4><span class="emr-entry-type">${e.entry_type}</span></div><span class="entry-date">${new Date(e.created_at).toLocaleDateString()} • ${e.doctor_name || 'Staff'}</span></div><p>${e.content || '—'}</p></div>`).join('') : '<p style="padding:1rem;color:var(--muted-foreground);">No EMR entries</p>'}
        </div>`;

        // Prescriptions
        const rx = data.prescriptions || [];
        document.getElementById('tab-prescriptions').innerHTML = `<div class="content-section"><div class="section-header"><h2>Prescriptions (${rx.length})</h2></div>
            ${rx.length ? `<table class="billing-table"><thead><tr><th>Drug</th><th>Dosage</th><th>Frequency</th><th>Duration</th><th>Doctor</th><th>Status</th></tr></thead><tbody>
            ${rx.map(r => `<tr><td><strong>${r.drug_name}</strong></td><td>${r.dosage}</td><td>${r.frequency}</td><td>${r.duration}</td><td>${r.doctor_name || '—'}</td><td><span class="queue-status ${r.prescription_status === 'active' ? 'status-checked-in' : 'status-completed'}">${r.prescription_status}</span></td></tr>`).join('')}
            </tbody></table>` : '<p style="padding:1rem;color:var(--muted-foreground);">No prescriptions</p>'}
        </div>`;

        // Lab
        const labs = data.lab_results || [];
        document.getElementById('tab-lab').innerHTML = `<div class="content-section"><div class="section-header"><h2>Lab Results (${labs.length})</h2></div>
            ${labs.length ? `<table class="billing-table"><thead><tr><th>Date</th><th>Ordered By</th><th>Status</th></tr></thead><tbody>
            ${labs.map(l => `<tr><td>${l.reported_at ? new Date(l.reported_at).toLocaleDateString() : '—'}</td><td>${l.doctor_name || 'Lab'}</td><td><span class="queue-status ${l.status === 'final' ? 'status-completed' : 'status-waiting'}">${l.status}</span></td></tr>`).join('')}
            </tbody></table>` : '<p style="padding:1rem;color:var(--muted-foreground);">No lab results</p>'}
        </div>`;

        // Billing
        const bills = data.billing || [];
        document.getElementById('tab-billing').innerHTML = `<div class="content-section"><div class="section-header"><h2>Billing History (${bills.length})</h2></div>
            ${bills.length ? `<table class="billing-table"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead><tbody>
            ${bills.map(b => `<tr><td>${new Date(b.created_at).toLocaleDateString()}</td><td>${b.billing_type}</td><td>${b.description || '—'}</td><td style="font-weight:700;">₦${Number(b.total).toLocaleString()}</td><td><span class="status-badge ${b.payment_status === 'paid' ? 'paid-badge' : 'pending'}">${b.payment_status}</span></td></tr>`).join('')}
            </tbody></table>` : '<p style="padding:1rem;color:var(--muted-foreground);">No billing records</p>'}
        </div>`;

        // Insurance
        const claims = data.insurance_claims || [];
        document.getElementById('tab-insurance').innerHTML = `<div class="content-section"><div class="section-header"><h2>Insurance Claims (${claims.length})</h2></div><div class="detail-grid" style="margin-bottom:1rem;">
            <div class="detail-row"><span class="detail-label">Provider</span><span>${p.insurance_provider || 'None'}</span></div>
            <div class="detail-row"><span class="detail-label">Policy #</span><span>${p.insurance_number || '—'}</span></div>
        </div>${claims.length ? `<table class="billing-table"><thead><tr><th>Date</th><th>Service</th><th>Amount</th><th>Status</th></tr></thead><tbody>
        ${claims.map(c => `<tr><td>${new Date(c.claim_date).toLocaleDateString()}</td><td>${c.service_description || '—'}</td><td>₦${Number(c.claim_amount).toLocaleString()}</td><td><span class="status-badge ${c.status === 'approved' || c.status === 'paid' ? 'paid-badge' : 'pending'}">${c.status}</span></td></tr>`).join('')}
        </tbody></table>` : ''}</div>`;

        // Referrals
        const refs = data.referrals || [];
        document.getElementById('tab-referrals').innerHTML = `<div class="content-section"><div class="section-header"><h2>Referrals (${refs.length})</h2></div>
            ${refs.length ? refs.map(r => `<div class="emr-entry"><div class="emr-entry-header"><div><h4>${r.referral_type === 'internal' ? 'Internal' : r.referral_type === 'external_incoming' ? 'Incoming' : 'Outgoing'}: ${r.specialty || 'General'}</h4><span class="emr-entry-type">${r.referral_type}</span></div><span class="entry-date">${new Date(r.created_at).toLocaleDateString()}</span></div><p><strong>From:</strong> ${r.referring_doctor || '—'} → <strong>To:</strong> ${r.referred_to_doctor || r.referred_to_hospital || '—'}<br><strong>Reason:</strong> ${r.reason}</p><div style="margin-top:0.5rem;"><span class="queue-status ${r.status === 'completed' ? 'status-completed' : 'status-waiting'}">${r.status}</span></div></div>`).join('') : '<p style="padding:1rem;color:var(--muted-foreground);">No referrals</p>'}
        </div>`;

    } catch (err) {
        console.error('Load patient error:', err);
        document.getElementById('tab-overview').innerHTML = '<p style="color:var(--destructive);padding:2rem;">Failed to load patient data</p>';
    }
}
</script>
