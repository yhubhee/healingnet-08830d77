<!-- Hospital Surgery Section -->
<div class="welcome-section">
    <div class="welcome-text">
        <h1>Surgery Department</h1>
        <p>Scheduled procedures, operating theatre management, and surgical records</p>
    </div>
</div>

<!-- Stats -->
<div class="stats-grid" style="margin-bottom:1.5rem;">
    <div class="stat-card gradient-primary">
        <i data-lucide="scissors" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Scheduled Today</p><h3 class="stat-value">4</h3></div>
    </div>
    <div class="stat-card gradient-success">
        <i data-lucide="check-circle" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Completed This Week</p><h3 class="stat-value">11</h3></div>
    </div>
    <div class="stat-card gradient-warning">
        <i data-lucide="clock" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Pending Approvals</p><h3 class="stat-value">3</h3></div>
    </div>
    <div class="stat-card gradient-info">
        <i data-lucide="bed" class="stat-icon"></i>
        <div class="stat-content"><p class="stat-label">Post-Op Monitoring</p><h3 class="stat-value">6</h3></div>
    </div>
</div>

<!-- Tabs -->
<div class="emr-tabs" style="margin-bottom:1.25rem;">
    <button class="emr-tab active" onclick="filterSurgeryTab('today')">Today's Schedule</button>
    <button class="emr-tab" onclick="filterSurgeryTab('upcoming')">Upcoming</button>
    <button class="emr-tab" onclick="filterSurgeryTab('post_op')">Post-Op</button>
    <button class="emr-tab" onclick="filterSurgeryTab('history')">Surgical History</button>
</div>

<!-- Surgery Schedule -->
<div style="overflow-x:auto;">
    <table class="queue-table">
        <thead><tr><th>Time</th><th>Patient</th><th>Procedure</th><th>Surgeon</th><th>Theatre</th><th>Anaesthesia</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="surgeryBody"></tbody>
    </table>
</div>

<script>
let allSurgeryRecords = [];
let currentSurgeryFilter = 'today';

async function loadSurgery() {
    try {
        const res = await fetch('/api/hospital/surgery', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            const s = data.stats || {};
            document.querySelectorAll('.stat-value')[0].textContent = s.today || 0;
            document.querySelectorAll('.stat-value')[1].textContent = s.completed_week || 0;
            document.querySelectorAll('.stat-value')[2].textContent = s.pending || 0;
            document.querySelectorAll('.stat-value')[3].textContent = s.post_op || 0;
            allSurgeryRecords = data.records || [];
            renderSurgery();
        }
    } catch(e) { console.error('Surgery error:', e); }
}

function renderSurgery() {
    const tbody = document.getElementById('surgeryBody');
    const today = new Date().toISOString().split('T')[0];
    let filtered = allSurgeryRecords;
    if (currentSurgeryFilter === 'today') filtered = allSurgeryRecords.filter(r => (r.scheduled_date||'').startsWith(today) || r.status === 'scheduled');
    else if (currentSurgeryFilter === 'upcoming') filtered = allSurgeryRecords.filter(r => r.status === 'scheduled' || r.status === 'approved');
    else if (currentSurgeryFilter === 'post_op') filtered = allSurgeryRecords.filter(r => r.status === 'post_op' || r.status === 'recovery');
    else if (currentSurgeryFilter === 'history') filtered = allSurgeryRecords.filter(r => r.status === 'completed');

    tbody.innerHTML = filtered.length ? filtered.map(r => `<tr>
        <td><strong>${r.scheduled_time || '—'}</strong></td>
        <td><strong>${r.patient_name || '—'}</strong></td>
        <td>${r.procedure_name}</td>
        <td>Dr. ${r.surgeon_name || '—'}</td>
        <td>${r.theatre_number || '—'}</td>
        <td>${r.anaesthesia_type || '—'}</td>
        <td><span class="queue-status ${r.status==='in_progress'?'status-in-consultation':r.status==='completed'?'status-completed':'status-waiting'}">${(r.status||'').replace(/_/g,' ')}</span></td>
        <td><button class="btn btn-sm btn-outline">Details</button></td>
    </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;padding:2rem;">No surgeries</td></tr>';
}

function filterSurgeryTab(filter) {
    currentSurgeryFilter = filter;
    document.querySelectorAll('.emr-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderSurgery();
}

loadSurgery();
</script>
