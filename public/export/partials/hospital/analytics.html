<!-- Hospital Analytics Partial -->
<div class="welcome-section"><div class="welcome-text"><h1>Analytics Dashboard</h1><p>Hospital performance, patient flow, revenue trends, and doctor utilization</p></div></div>

<div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap;">
    <span style="font-size:0.85rem;color:var(--muted-foreground);">Period:</span>
    <button class="queue-filter-btn active" onclick="loadAnalytics('today', this)">Today</button>
    <button class="queue-filter-btn" onclick="loadAnalytics('week', this)">This Week</button>
    <button class="queue-filter-btn" onclick="loadAnalytics('month', this)">This Month</button>
    <button class="queue-filter-btn" onclick="loadAnalytics('30days', this)">Last 30 Days</button>
</div>

<div class="stats-grid" style="margin-bottom:1.5rem;">
    <div class="stat-card gradient-primary"><i data-lucide="users" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Total Patients</p><h3 class="stat-value" id="anTotal">—</h3></div></div>
    <div class="stat-card gradient-success"><i data-lucide="credit-card" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Revenue</p><h3 class="stat-value" id="anRevenue">—</h3></div></div>
    <div class="stat-card gradient-warning"><i data-lucide="clock" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Avg Wait Time</p><h3 class="stat-value" id="anWait">—</h3></div></div>
    <div class="stat-card gradient-info"><i data-lucide="user-check" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Active Doctors</p><h3 class="stat-value" id="anDoctors">—</h3></div></div>
</div>

<div class="analytics-grid">
    <div class="analytics-card" id="patientFlowCard"><h3>Patient Flow</h3><p style="color:var(--muted-foreground);">Loading...</p></div>
    <div class="analytics-card" id="revenueCard"><h3>Revenue Breakdown</h3><p style="color:var(--muted-foreground);">Loading...</p></div>
    <div class="analytics-card" id="doctorUtilCard"><h3>Doctor Utilization</h3><p style="color:var(--muted-foreground);">Loading...</p></div>
    <div class="analytics-card" id="deptStatsCard"><h3>Department Performance</h3><p style="color:var(--muted-foreground);">Loading...</p></div>
</div>

<script>
async function loadAnalytics(period, btn) {
    document.querySelectorAll('.queue-filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const today = new Date().toISOString().split('T')[0];
    let from = today, to = today;
    if (period === 'week') { const d = new Date(); d.setDate(d.getDate() - 7); from = d.toISOString().split('T')[0]; }
    else if (period === 'month') { const d = new Date(); d.setDate(1); from = d.toISOString().split('T')[0]; }
    else if (period === '30days') { const d = new Date(); d.setDate(d.getDate() - 30); from = d.toISOString().split('T')[0]; }

    try {
        const [overviewRes, deptRes] = await Promise.all([
            fetch(`/api/hospital/analytics/overview?from=${from}&to=${to}`, { credentials: 'include' }),
            fetch('/api/hospital/analytics/department-stats', { credentials: 'include' }),
        ]);
        const overview = await overviewRes.json();
        const dept = await deptRes.json();

        if (overview.success) {
            const pf = overview.patient_flow || {};
            const rev = overview.revenue || {};
            const dc = overview.doctor_counts || {};

            document.getElementById('anTotal').textContent = (pf.total_patients || 0).toLocaleString();
            document.getElementById('anRevenue').textContent = '₦' + Number(rev.total_revenue || 0).toLocaleString();
            document.getElementById('anWait').textContent = Math.round(pf.avg_wait_minutes || 0) + ' min';
            document.getElementById('anDoctors').textContent = dc.total || 0;

            // Patient flow
            const total = pf.total_patients || 1;
            document.getElementById('patientFlowCard').innerHTML = `<h3>Patient Flow</h3>
                <div class="analytics-metric"><span class="metric-label">Pre-booked</span><span class="metric-value">${pf.pre_booked || 0}</span></div>
                <div class="analytics-bar"><div class="analytics-bar-fill" style="width:${((pf.pre_booked||0)/total*100)}%;"></div></div>
                <div class="analytics-metric" style="margin-top:1rem;"><span class="metric-label">Walk-ins</span><span class="metric-value">${pf.walk_ins || 0}</span></div>
                <div class="analytics-bar"><div class="analytics-bar-fill" style="width:${((pf.walk_ins||0)/total*100)}%;background:var(--gradient-warning);"></div></div>
                <div class="analytics-metric" style="margin-top:1rem;"><span class="metric-label">No-shows</span><span class="metric-value" style="color:var(--destructive);">${pf.no_shows || 0}</span></div>
                <div class="analytics-bar"><div class="analytics-bar-fill" style="width:${((pf.no_shows||0)/total*100)}%;background:var(--gradient-danger);"></div></div>
                <div class="analytics-metric" style="margin-top:1rem;"><span class="metric-label">Completed</span><span class="metric-value" style="color:var(--success);">${pf.completed || 0}</span></div>`;

            // Revenue
            document.getElementById('revenueCard').innerHTML = `<h3>Revenue</h3>
                <div class="analytics-metric"><span class="metric-label">Collected</span><span class="metric-value" style="color:var(--success);">₦${Number(rev.collected||0).toLocaleString()}</span></div>
                <div class="analytics-metric" style="margin-top:0.75rem;"><span class="metric-label">Pending</span><span class="metric-value" style="color:var(--warning);">₦${Number(rev.pending||0).toLocaleString()}</span></div>
                <div class="analytics-metric" style="margin-top:0.75rem;"><span class="metric-label">External Consults</span><span class="metric-value">₦${Number(rev.external_revenue||0).toLocaleString()}</span></div>`;

            // Doctor utilization
            const docUtil = overview.doctor_utilization || [];
            document.getElementById('doctorUtilCard').innerHTML = `<h3>Doctor Utilization</h3>` +
                docUtil.slice(0,5).map(d => {
                    const maxP = Math.max(...docUtil.map(x => x.patients_seen || 1));
                    return `<div class="analytics-metric"><span class="metric-label">Dr. ${d.last_name} (${d.specialty || '—'})</span><span class="metric-value">${d.patients_seen || 0} patients</span></div>
                    <div class="analytics-bar"><div class="analytics-bar-fill" style="width:${((d.patients_seen||0)/maxP*100)}%;"></div></div>`;
                }).join('');
        }

        if (dept.success) {
            const stats = dept.stats || [];
            document.getElementById('deptStatsCard').innerHTML = `<h3>Department Performance</h3>` +
                stats.map(s => `<div class="analytics-metric"><span class="metric-label">${s.department}</span><span class="metric-value">${s.total_patients} visits</span></div>
                <div class="analytics-metric"><span class="metric-label" style="font-size:0.78rem;">Avg wait: ${Math.round(s.avg_wait||0)} min</span></div>
                <div style="height:1px;background:var(--border);margin:0.5rem 0;"></div>`).join('');
        }
    } catch (err) { console.error('Analytics error:', err); }
}

loadAnalytics('today');
</script>
