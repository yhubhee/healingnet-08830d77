<!-- Hospital Doctor Management Partial -->
<div class="welcome-section">
    <div class="welcome-text"><h1>Doctor Management</h1><p>Add, remove, and manage doctors assigned to your hospital</p></div>
</div>

<div class="doctor-management-header">
    <div class="queue-filters">
        <button class="queue-filter-btn active" onclick="filterDoctors('')">All</button>
        <button class="queue-filter-btn" onclick="filterDoctors('full_time')">Full-time</button>
        <button class="queue-filter-btn" onclick="filterDoctors('visiting_consultant')">Visiting</button>
        <button class="queue-filter-btn" onclick="filterDoctors('locum')">Locum</button>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('addDoctorModal').classList.add('show')"><i data-lucide="user-plus"></i> Add Doctor</button>
</div>

<div class="doctor-cards-grid" id="doctorCards">
    <p style="padding:2rem;color:var(--muted-foreground);text-align:center;">Loading doctors...</p>
</div>

<!-- Add Doctor Modal -->
<div class="modal-overlay" id="addDoctorModal">
    <div class="modal-content">
        <h2><i data-lucide="user-plus" style="width:20px;height:20px;display:inline;"></i> Add Doctor to Hospital</h2>
        <form id="addDoctorForm">
            <div class="form-group"><label>Doctor ID</label><input type="number" id="addDocId" required placeholder="Enter doctor ID"></div>
            <div class="form-group"><label>Employment Type</label><select id="addDocType"><option value="full_time">Full-time</option><option value="visiting_consultant">Visiting Consultant</option><option value="locum">Locum</option></select></div>
            <div class="form-group"><label>Department</label><input type="text" id="addDocDept" placeholder="e.g., Cardiology"></div>
            <div class="form-group"><label>Contract Start</label><input type="date" id="addDocStart"></div>
            <div class="form-group"><label>Contract End (optional)</label><input type="date" id="addDocEnd"></div>
            <div class="form-group"><label>Salary / Fee (₦)</label><input type="number" id="addDocSalary" placeholder="Monthly salary"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="document.getElementById('addDoctorModal').classList.remove('show')">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Doctor</button>
            </div>
        </form>
    </div>
</div>

<script>
async function loadDoctors(typeFilter) {
    try {
        let url = '/api/hospital/doctors';
        if (typeFilter) url += '?type=' + typeFilter;
        const res = await fetch(url, { credentials: 'include' });
        const data = await res.json();
        if (data.success) renderDoctors(data.doctors || []);
    } catch (err) { console.error('Load doctors error:', err); }
}

function renderDoctors(doctors) {
    const container = document.getElementById('doctorCards');
    if (!doctors.length) { container.innerHTML = '<p style="padding:2rem;color:var(--muted-foreground);text-align:center;">No doctors found</p>'; return; }

    container.innerHTML = doctors.map(d => {
        const initials = ((d.first_name||'')[0]||'') + ((d.last_name||'')[0]||'');
        const typeClass = d.employment_type === 'full_time' ? 'full-time' : d.employment_type === 'visiting_consultant' ? 'visiting' : 'locum';
        const typeLabel = d.employment_type === 'full_time' ? 'Full-time' : d.employment_type === 'visiting_consultant' ? 'Visiting' : 'Locum';

        return `<div class="doctor-mgmt-card">
            <div class="doctor-mgmt-header">
                <div class="avatar">${initials}</div>
                <div class="doctor-mgmt-name"><h3>Dr. ${d.first_name} ${d.last_name}</h3><p>${d.specialty || '—'}</p></div>
                <span class="doctor-type-badge ${typeClass}">${typeLabel}</span>
            </div>
            <div class="doctor-mgmt-meta">
                <span><i data-lucide="award"></i> ${d.years_experience || '?'} yrs exp</span>
                <span><i data-lucide="star"></i> ${d.rating || '—'}</span>
                <span><i data-lucide="briefcase"></i> ${d.department || '—'}</span>
                <span class="doctor-status-dot ${d.is_available ? 'online' : 'offline'}" style="margin-left:auto;"></span>
            </div>
            <div class="doctor-mgmt-actions">
                <button class="btn btn-outline btn-sm" onclick="editDoctor(${d.id})">Edit</button>
                <button class="btn btn-sm" style="color:var(--destructive);" onclick="removeDoctor(${d.id})">Remove</button>
            </div>
        </div>`;
    }).join('');
    if (typeof lucide !== 'undefined') lucide.createIcons();
}

function filterDoctors(type) {
    document.querySelectorAll('.queue-filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadDoctors(type);
}

async function removeDoctor(id) {
    if (!confirm('Remove this doctor from the hospital?')) return;
    try {
        const res = await fetch(`/api/hospital/doctors/${id}`, { method: 'DELETE', credentials: 'include' });
        if ((await res.json()).success) loadDoctors();
    } catch (err) { console.error('Remove error:', err); }
}

document.getElementById('addDoctorForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await fetch('/api/hospital/doctors', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                doctor_id: document.getElementById('addDocId').value,
                employment_type: document.getElementById('addDocType').value,
                department: document.getElementById('addDocDept').value,
                contract_start: document.getElementById('addDocStart').value || null,
                contract_end: document.getElementById('addDocEnd').value || null,
                salary: document.getElementById('addDocSalary').value || null,
            })
        });
        const data = await res.json();
        if (data.success) { document.getElementById('addDoctorModal').classList.remove('show'); loadDoctors(); }
        else alert(data.message);
    } catch (err) { console.error('Add doctor error:', err); }
});

loadDoctors();
</script>
