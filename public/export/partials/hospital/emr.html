<!-- Hospital EMR Partial -->
<div class="welcome-section">
    <div class="welcome-text">
        <h1>Electronic Medical Records</h1>
        <p>View and manage patient medical records, vitals, diagnoses, and treatment history</p>
    </div>
</div>

<!-- Patient Search -->
<div class="emr-patient-search">
    <div class="marketplace-search">
        <input type="text" id="emrSearchInput" placeholder="Search patients by name, ID, phone, or email..." style="flex:1;" onkeydown="if(event.key==='Enter')searchEmrPatients()">
        <button class="btn btn-primary" onclick="searchEmrPatients()"><i data-lucide="search"></i> Search</button>
    </div>
    <div id="emrSearchResults" style="display:none;margin-top:0.75rem;max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--card);"></div>
</div>

<!-- Selected Patient Header -->
<div class="emr-patient-header" id="emrPatientHeader" style="display:none;">
    <div class="avatar" style="width:64px;height:64px;font-size:1.5rem;" id="emrAvatar">—</div>
    <div class="emr-patient-info" style="flex:1;">
        <h2 id="emrPatientName">—</h2>
        <div class="patient-meta" id="emrPatientMeta"></div>
    </div>
    <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-outline btn-sm" onclick="toggleFullProfile()"><i data-lucide="user"></i> Full Profile</button>
        <button class="btn btn-primary btn-sm" onclick="openNewEntry()">
            <i data-lucide="plus"></i> New Entry
        </button>
    </div>
</div>

<!-- ===================== FULL PROFILE PANEL ===================== -->
<div id="emrFullProfile" style="display:none;margin-bottom:1.5rem;">
    <div class="card" style="padding:1.5rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h2 style="font-size:1.1rem;">Full Patient Profile</h2>
            <button class="btn btn-outline btn-sm" onclick="toggleFullProfile()">Close</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
            <!-- Personal -->
            <div class="content-section"><div class="section-header"><h3 style="font-size:0.95rem;">Personal Information</h3></div>
                <div class="detail-grid" id="profPersonal"></div>
            </div>
            <!-- Medical -->
            <div class="content-section"><div class="section-header"><h3 style="font-size:0.95rem;">Medical Details</h3></div>
                <div class="detail-grid" id="profMedical"></div>
            </div>
            <!-- Emergency & Insurance -->
            <div class="content-section"><div class="section-header"><h3 style="font-size:0.95rem;">Emergency Contact</h3></div>
                <div class="detail-grid" id="profEmergency"></div>
            </div>
            <div class="content-section"><div class="section-header"><h3 style="font-size:0.95rem;">Insurance</h3></div>
                <div class="detail-grid" id="profInsurance"></div>
            </div>
        </div>
    </div>
</div>

<!-- EMR Tabs -->
<div class="emr-tabs" id="emrTabBar" style="display:none;">
    <button class="emr-tab active" onclick="filterEmrTab('all', this)">All Records</button>
    <button class="emr-tab" onclick="filterEmrTab('consultation_note', this)">Consultation Notes</button>
    <button class="emr-tab" onclick="filterEmrTab('vitals', this)">Vitals</button>
    <button class="emr-tab" onclick="filterEmrTab('diagnosis', this)">Diagnoses</button>
    <button class="emr-tab" onclick="filterEmrTab('procedure', this)">Procedures</button>
    <button class="emr-tab" onclick="filterEmrTab('lab_order', this)">Lab Orders</button>
    <button class="emr-tab" onclick="filterEmrTab('lab_result', this)">Lab Results</button>
    <button class="emr-tab" onclick="filterEmrTab('imaging', this)">Imaging</button>
    <button class="emr-tab" onclick="filterEmrTab('referral', this)">Referrals</button>
    <button class="emr-tab" onclick="filterEmrTab('discharge_summary', this)">Discharge</button>
    <button class="emr-tab" onclick="filterEmrTab('surgery_note', this)">Surgery</button>
    <button class="emr-tab" onclick="filterEmrTab('antenatal', this)">Antenatal</button>
    <button class="emr-tab" onclick="filterEmrTab('delivery', this)">Delivery</button>
    <button class="emr-tab" onclick="filterEmrTab('postnatal', this)">Postnatal</button>
</div>

<!-- EMR Entries -->
<div class="emr-entries" id="emrEntries" style="display:none;">
    <p style="padding:2rem;text-align:center;color:var(--muted-foreground);">Search and select a patient to view records</p>
</div>

<!-- ===================== NEW EMR ENTRY MODAL ===================== -->
<div class="modal-overlay" id="emrEntryModal">
    <div class="modal-content" style="max-width:700px;max-height:90vh;overflow-y:auto;">
        <h2><i data-lucide="file-plus" style="width:20px;height:20px;display:inline;"></i> New EMR Entry</h2>
        <form id="emrEntryForm">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>Entry Type</label>
                    <select id="entryType" onchange="showEntryFields(this.value)" required>
                        <option value="">— Select Type —</option>
                        <option value="consultation_note">Consultation Note</option>
                        <option value="vitals">Vitals</option>
                        <option value="diagnosis">Diagnosis</option>
                        <option value="procedure">Procedure</option>
                        <option value="lab_order">Lab Order</option>
                        <option value="lab_result">Lab Result</option>
                        <option value="imaging">Imaging</option>
                        <option value="referral">Referral</option>
                        <option value="discharge_summary">Discharge Summary</option>
                        <option value="surgery_note">Surgery Note</option>
                        <option value="antenatal">Antenatal Visit</option>
                        <option value="delivery">Delivery Record</option>
                        <option value="postnatal">Postnatal Visit</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor</label>
                    <select id="entryDoctor"></select>
                </div>
            </div>
            <div class="form-group"><label>Title</label><input type="text" id="entryTitle" required placeholder="Entry title..."></div>

            <!-- ===== DYNAMIC FIELDS PER ENTRY TYPE ===== -->
            <div id="dynamicFields"></div>

            <div class="form-group"><label>General Notes</label><textarea id="entryContent" rows="3" placeholder="Additional notes..."></textarea></div>
            <div class="form-group"><label><input type="checkbox" id="entryConfidential" style="width:auto;margin-right:0.5rem;"> Mark as confidential</label></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeNewEntry()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Entry</button>
            </div>
        </form>
    </div>
</div>

<script>
let emrPatientId = null;
let emrPatientData = null;
let emrEntries = [];
let emrDoctors = [];

// ===================== SEARCH =====================
async function searchEmrPatients() {
    const q = document.getElementById('emrSearchInput').value.trim();
    if (!q) return;
    try {
        const res = await fetch('/api/hospital/emr/patients?search=' + encodeURIComponent(q), { credentials: 'include' });
        const data = await res.json();
        const box = document.getElementById('emrSearchResults');
        if (!data.success || !data.patients.length) {
            box.innerHTML = '<p style="padding:1rem;color:var(--muted-foreground);text-align:center;">No patients found</p>';
            box.style.display = 'block'; return;
        }
        box.innerHTML = data.patients.map(p => {
            const age = p.date_of_birth ? Math.floor((Date.now() - new Date(p.date_of_birth)) / 31557600000) : '?';
            return `<div onclick="selectEmrPatient(${p.id})" style="padding:0.75rem 1rem;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.75rem;transition:background 0.15s;" onmouseover="this.style.background='var(--accent)'" onmouseout="this.style.background=''">
                <div class="avatar" style="width:36px;height:36px;font-size:0.8rem;">${(p.firstname||p.first_name||'')[0]||''}${(p.lastname||p.last_name||'')[0]||''}</div>
                <div style="flex:1;"><strong>${p.firstname||p.first_name||''} ${p.lastname||p.last_name||''}</strong><br><small style="color:var(--muted-foreground);">${p.gender||'?'} • ${age} yrs • ${p.phone||'—'}</small></div>
                <span style="font-size:0.8rem;color:var(--muted-foreground);">ID: ${p.id}</span>
            </div>`;
        }).join('');
        box.style.display = 'block';
    } catch (err) { console.error('Search error:', err); }
}

// ===================== SELECT PATIENT =====================
async function selectEmrPatient(id) {
    emrPatientId = id;
    document.getElementById('emrSearchResults').style.display = 'none';
    try {
        const res = await fetch(`/api/hospital/emr/patients/${id}`, { credentials: 'include' });
        const data = await res.json();
        if (!data.success) return;
        emrPatientData = data.patient;
        emrEntries = data.emr_entries || [];

        const p = emrPatientData;
        const fn = p.firstname || p.first_name || '';
        const ln = p.lastname || p.last_name || '';
        const age = p.date_of_birth ? Math.floor((Date.now() - new Date(p.date_of_birth)) / 31557600000) : '?';

        document.getElementById('emrAvatar').textContent = (fn[0]||'') + (ln[0]||'');
        document.getElementById('emrPatientName').textContent = fn + ' ' + ln;
        document.getElementById('emrPatientMeta').innerHTML = `
            <span><i data-lucide="user" style="width:14px;height:14px;display:inline;"></i> ${p.gender||'?'}, ${age} yrs</span>
            <span><i data-lucide="droplet" style="width:14px;height:14px;display:inline;"></i> ${p.blood_type||p.blood_group||'?'} • ${p.genotype||'?'}</span>
            <span><i data-lucide="phone" style="width:14px;height:14px;display:inline;"></i> ${p.phone||'—'}</span>
            ${p.allergies ? `<span><i data-lucide="alert-triangle" style="width:14px;height:14px;display:inline;color:var(--warning);"></i> Allergies: ${p.allergies}</span>` : ''}
        `;

        // Fill profile sections
        fillFullProfile(p);

        document.getElementById('emrPatientHeader').style.display = 'flex';
        document.getElementById('emrTabBar').style.display = '';
        document.getElementById('emrEntries').style.display = '';
        renderEmrEntries(emrEntries);
        if (typeof lucide !== 'undefined') lucide.createIcons();
    } catch (err) { console.error('Select patient error:', err); }
}

// ===================== FULL PROFILE =====================
function fillFullProfile(p) {
    const dob = p.date_of_birth ? new Date(p.date_of_birth).toLocaleDateString() : '—';
    document.getElementById('profPersonal').innerHTML = `
        <div class="detail-row"><span class="detail-label">Full Name</span><span>${p.firstname||p.first_name||''} ${p.lastname||p.last_name||''}</span></div>
        <div class="detail-row"><span class="detail-label">Date of Birth</span><span>${dob}</span></div>
        <div class="detail-row"><span class="detail-label">Gender</span><span>${p.gender||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Phone</span><span>${p.phone||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Email</span><span>${p.email||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Address</span><span>${p.address||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">National ID</span><span>${p.national_id||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Marital Status</span><span>${p.marital_status||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Occupation</span><span>${p.occupation||'—'}</span></div>
    `;
    document.getElementById('profMedical').innerHTML = `
        <div class="detail-row"><span class="detail-label">Blood Type</span><span>${p.blood_type||p.blood_group||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Genotype</span><span>${p.genotype||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Allergies</span><span>${p.allergies||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Chronic Conditions</span><span>${p.chronic_conditions||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Current Medications</span><span>${p.medications||p.current_medications||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Surgical History</span><span>${p.surgical_history||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Family History</span><span>${p.family_medical_history||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Medical Conditions</span><span>${p.medical_conditions||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Disabilities</span><span>${p.disabilities||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Smoking</span><span>${p.smoking_status||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Alcohol</span><span>${p.alcohol_consumption||'—'}</span></div>
    `;
    document.getElementById('profEmergency').innerHTML = `
        <div class="detail-row"><span class="detail-label">Name</span><span>${p.emergency_contact_name||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Phone</span><span>${p.emergency_contact_phone||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Relationship</span><span>${p.emergency_contact_relationship||'—'}</span></div>
    `;
    document.getElementById('profInsurance').innerHTML = `
        <div class="detail-row"><span class="detail-label">Provider</span><span>${p.insurance_provider||'None'}</span></div>
        <div class="detail-row"><span class="detail-label">Policy #</span><span>${p.insurance_number||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">HMO</span><span>${p.hmo_provider||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">HMO ID</span><span>${p.hmo_id||'—'}</span></div>
    `;
}

function toggleFullProfile() {
    const el = document.getElementById('emrFullProfile');
    el.style.display = el.style.display === 'none' ? '' : 'none';
}

// ===================== RENDER EMR ENTRIES =====================
const typeColors = {
    consultation_note: { bg: 'hsl(210,80%,55%,0.15)', color: 'hsl(210,80%,65%)' },
    vitals: { bg: 'hsl(160,84%,39%,0.15)', color: 'var(--success)' },
    diagnosis: { bg: 'hsl(0,84%,60%,0.15)', color: 'var(--destructive)' },
    procedure: { bg: 'hsl(280,60%,55%,0.15)', color: 'hsl(280,60%,65%)' },
    lab_order: { bg: 'hsl(38,92%,50%,0.15)', color: 'var(--warning)' },
    lab_result: { bg: 'hsl(38,92%,50%,0.15)', color: 'var(--warning)' },
    imaging: { bg: 'hsl(270,60%,50%,0.15)', color: 'hsl(270,60%,65%)' },
    referral: { bg: 'hsl(190,70%,50%,0.15)', color: 'hsl(190,70%,60%)' },
    discharge_summary: { bg: 'hsl(140,50%,45%,0.15)', color: 'hsl(140,50%,60%)' },
    surgery_note: { bg: 'hsl(350,70%,55%,0.15)', color: 'hsl(350,70%,65%)' },
    antenatal: { bg: 'hsl(320,60%,55%,0.15)', color: 'hsl(320,60%,65%)' },
    delivery: { bg: 'hsl(330,70%,55%,0.15)', color: 'hsl(330,70%,65%)' },
    postnatal: { bg: 'hsl(300,50%,55%,0.15)', color: 'hsl(300,50%,65%)' },
};

function typeLabel(t) { return (t||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }

function renderEmrEntries(entries) {
    const container = document.getElementById('emrEntries');
    if (!entries.length) { container.innerHTML = '<p style="padding:2rem;text-align:center;color:var(--muted-foreground);">No EMR entries found for this patient</p>'; return; }

    container.innerHTML = entries.map(e => {
        const tc = typeColors[e.entry_type] || { bg: 'hsl(0,0%,50%,0.15)', color: 'var(--muted-foreground)' };
        const docName = e.doctor_first_name ? `Dr. ${e.doctor_first_name} ${e.doctor_last_name||''}` : 'Staff';
        const date = new Date(e.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
        let body = '';
        const sd = e.structured_data ? (typeof e.structured_data === 'string' ? JSON.parse(e.structured_data) : e.structured_data) : null;

        // Render structured data based on type
        if (e.entry_type === 'vitals' && sd) {
            body = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.75rem;margin-top:0.5rem;">
                ${Object.entries(sd).map(([k,v]) => `<div style="background:var(--background);padding:0.75rem;border-radius:var(--radius);"><small style="color:var(--muted-foreground);">${typeLabel(k)}</small><p style="font-weight:700;">${v}</p></div>`).join('')}
            </div>`;
        } else if (e.entry_type === 'lab_result' && sd && sd.results) {
            body = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.5rem;margin-top:0.5rem;">
                ${sd.results.map(r => `<div style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--border);"><span style="font-size:0.85rem;">${r.test}</span><span style="font-weight:600;">${r.value} ${r.unit||''} <small style="color:${r.flag==='normal'?'var(--success)':'var(--destructive)'};">${r.flag||''}</small></span></div>`).join('')}
            </div>`;
        } else if (e.entry_type === 'diagnosis' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;display:flex;gap:1rem;flex-wrap:wrap;">
                    ${sd.icd_code ? `<span style="font-size:0.85rem;"><strong>ICD-10:</strong> ${sd.icd_code}</span>` : ''}
                    ${sd.severity ? `<span style="font-size:0.85rem;"><strong>Severity:</strong> ${sd.severity}</span>` : ''}
                    ${sd.type ? `<span style="font-size:0.85rem;"><strong>Type:</strong> ${sd.type}</span>` : ''}
                </div>`;
        } else if (e.entry_type === 'procedure' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;display:flex;gap:1rem;flex-wrap:wrap;font-size:0.85rem;">
                    ${sd.procedure_name ? `<span><strong>Procedure:</strong> ${sd.procedure_name}</span>` : ''}
                    ${sd.anaesthesia ? `<span><strong>Anaesthesia:</strong> ${sd.anaesthesia}</span>` : ''}
                    ${sd.outcome ? `<span><strong>Outcome:</strong> ${sd.outcome}</span>` : ''}
                    ${sd.complications ? `<span style="color:var(--destructive);"><strong>Complications:</strong> ${sd.complications}</span>` : ''}
                </div>`;
        } else if (e.entry_type === 'lab_order' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.tests ? `<strong>Tests ordered:</strong> ${Array.isArray(sd.tests) ? sd.tests.join(', ') : sd.tests}` : ''}
                    ${sd.urgency ? ` • <strong>Urgency:</strong> ${sd.urgency}` : ''}
                    ${sd.fasting ? ` • <strong>Fasting:</strong> ${sd.fasting}` : ''}
                </div>`;
        } else if (e.entry_type === 'imaging' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.modality ? `<strong>Modality:</strong> ${sd.modality}` : ''}
                    ${sd.body_part ? ` • <strong>Body part:</strong> ${sd.body_part}` : ''}
                    ${sd.findings ? `<br><strong>Findings:</strong> ${sd.findings}` : ''}
                    ${sd.impression ? `<br><strong>Impression:</strong> ${sd.impression}` : ''}
                </div>`;
        } else if (e.entry_type === 'referral' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.referred_to ? `<strong>Referred to:</strong> ${sd.referred_to}` : ''}
                    ${sd.specialty ? ` • <strong>Specialty:</strong> ${sd.specialty}` : ''}
                    ${sd.urgency ? ` • <strong>Urgency:</strong> ${sd.urgency}` : ''}
                    ${sd.reason ? `<br><strong>Reason:</strong> ${sd.reason}` : ''}
                </div>`;
        } else if (e.entry_type === 'discharge_summary' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.admission_date ? `<strong>Admitted:</strong> ${sd.admission_date}` : ''}
                    ${sd.discharge_date ? ` → <strong>Discharged:</strong> ${sd.discharge_date}` : ''}
                    ${sd.discharge_diagnosis ? `<br><strong>Diagnosis:</strong> ${sd.discharge_diagnosis}` : ''}
                    ${sd.discharge_medications ? `<br><strong>Medications:</strong> ${sd.discharge_medications}` : ''}
                    ${sd.follow_up ? `<br><strong>Follow-up:</strong> ${sd.follow_up}` : ''}
                </div>`;
        } else if (e.entry_type === 'surgery_note' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.procedure_name ? `<strong>Procedure:</strong> ${sd.procedure_name}` : ''}
                    ${sd.anaesthesia_type ? ` • <strong>Anaesthesia:</strong> ${sd.anaesthesia_type}` : ''}
                    ${sd.duration ? ` • <strong>Duration:</strong> ${sd.duration} min` : ''}
                    ${sd.blood_loss ? ` • <strong>Blood loss:</strong> ${sd.blood_loss} ml` : ''}
                    ${sd.findings ? `<br><strong>Findings:</strong> ${sd.findings}` : ''}
                    ${sd.complications ? `<br><span style="color:var(--destructive);"><strong>Complications:</strong> ${sd.complications}</span>` : ''}
                    ${sd.post_op_instructions ? `<br><strong>Post-op:</strong> ${sd.post_op_instructions}` : ''}
                </div>`;
        } else if (e.entry_type === 'antenatal' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.gestational_age ? `<strong>Gest. Age:</strong> ${sd.gestational_age} weeks` : ''}
                    ${sd.fundal_height ? ` • <strong>Fundal Height:</strong> ${sd.fundal_height} cm` : ''}
                    ${sd.fetal_heart_rate ? ` • <strong>FHR:</strong> ${sd.fetal_heart_rate} bpm` : ''}
                    ${sd.presentation ? ` • <strong>Presentation:</strong> ${sd.presentation}` : ''}
                    ${sd.blood_pressure ? `<br><strong>BP:</strong> ${sd.blood_pressure}` : ''}
                    ${sd.weight ? ` • <strong>Weight:</strong> ${sd.weight} kg` : ''}
                    ${sd.urine_protein ? ` • <strong>Urine Protein:</strong> ${sd.urine_protein}` : ''}
                    ${sd.complaints ? `<br><strong>Complaints:</strong> ${sd.complaints}` : ''}
                </div>`;
        } else if (e.entry_type === 'delivery' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.delivery_type ? `<strong>Type:</strong> ${sd.delivery_type}` : ''}
                    ${sd.delivery_date ? ` • <strong>Date:</strong> ${sd.delivery_date}` : ''}
                    ${sd.baby_weight ? ` • <strong>Baby Weight:</strong> ${sd.baby_weight} kg` : ''}
                    ${sd.baby_gender ? ` • <strong>Gender:</strong> ${sd.baby_gender}` : ''}
                    ${sd.apgar_score ? ` • <strong>APGAR:</strong> ${sd.apgar_score}` : ''}
                    ${sd.blood_loss ? `<br><strong>Blood Loss:</strong> ${sd.blood_loss} ml` : ''}
                    ${sd.complications ? `<br><span style="color:var(--destructive);"><strong>Complications:</strong> ${sd.complications}</span>` : ''}
                </div>`;
        } else if (e.entry_type === 'postnatal' && sd) {
            body = `<p>${e.content||''}</p>
                <div style="margin-top:0.5rem;font-size:0.85rem;">
                    ${sd.days_postpartum ? `<strong>Days Postpartum:</strong> ${sd.days_postpartum}` : ''}
                    ${sd.mother_condition ? ` • <strong>Mother:</strong> ${sd.mother_condition}` : ''}
                    ${sd.baby_condition ? ` • <strong>Baby:</strong> ${sd.baby_condition}` : ''}
                    ${sd.breastfeeding ? ` • <strong>Breastfeeding:</strong> ${sd.breastfeeding}` : ''}
                    ${sd.baby_weight ? `<br><strong>Baby Weight:</strong> ${sd.baby_weight} kg` : ''}
                    ${sd.immunization ? ` • <strong>Immunization:</strong> ${sd.immunization}` : ''}
                </div>`;
        } else {
            body = `<p>${e.content||'No content'}</p>`;
        }

        return `<div class="emr-entry" data-type="${e.entry_type}">
            <div class="emr-entry-header">
                <div>
                    <span class="emr-entry-type" style="background:${tc.bg};color:${tc.color};">${typeLabel(e.entry_type)}</span>
                    <h4>${e.title}</h4>
                </div>
                <span class="entry-date">${date} • ${docName}${e.is_confidential ? ' 🔒' : ''}</span>
            </div>
            ${body}
        </div>`;
    }).join('');
    if (typeof lucide !== 'undefined') lucide.createIcons();
}

function filterEmrTab(type, btn) {
    document.querySelectorAll('.emr-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    if (type === 'all') { renderEmrEntries(emrEntries); return; }
    renderEmrEntries(emrEntries.filter(e => e.entry_type === type));
}

function openNewEntry() {
    loadDoctorsList();
    document.getElementById('emrEntryModal').classList.add('show');
}
function closeNewEntry() {
    document.getElementById('emrEntryModal').classList.remove('show');
    document.getElementById('emrEntryForm').reset();
    document.getElementById('dynamicFields').innerHTML = '';
}

async function loadDoctorsList() {
    if (emrDoctors.length) return;
    try {
        const res = await fetch('/api/hospital/doctors', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            emrDoctors = data.doctors || [];
            const sel = document.getElementById('entryDoctor');
            sel.innerHTML = '<option value="">— Select Doctor —</option>' + emrDoctors.map(d => `<option value="${d.doctor_id||d.id}">Dr. ${d.first_name} ${d.last_name} (${d.specialty||d.department||'—'})</option>`).join('');
        }
    } catch (err) { console.error('Load doctors error:', err); }
}

        };
        wEl.addEventListener('input', calc);
        hEl.addEventListener('input', calc);
    }
}

// ===================== COLLECT STRUCTURED DATA =====================
function collectStructuredData(type) {
    const sd = {};
    const fields = document.querySelectorAll('#dynamicFields input, #dynamicFields select, #dynamicFields textarea');
    fields.forEach(f => {
        if (!f.id || !f.id.startsWith('sf_')) return;
        const key = f.id.replace('sf_', '');
        const val = f.value.trim();
        if (val) sd[key] = val;
    });

    // Parse lab results into array
    if (type === 'lab_result' && sd.results_raw) {
        sd.results = sd.results_raw.split('\n').filter(l=>l.trim()).map(line => {
            const parts = line.split('|').map(s=>s.trim());
            return { test: parts[0]||'', value: parts[1]||'', unit: parts[2]||'', flag: parts[3]||'normal' };
        });
        delete sd.results_raw;
    }

    // Parse lab order tests into array
    if (type === 'lab_order' && sd.tests) {
        sd.tests = sd.tests.split(',').map(s=>s.trim()).filter(Boolean);
    }

    return sd;
}

// ===================== SUBMIT ENTRY =====================
document.getElementById('emrEntryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!emrPatientId) { alert('No patient selected'); return; }
    const type = document.getElementById('entryType').value;
    if (!type) { alert('Select an entry type'); return; }

    const structured_data = collectStructuredData(type);

    try {
        const res = await fetch('/api/hospital/emr/entries', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                patient_id: emrPatientId,
                doctor_id: document.getElementById('entryDoctor').value || null,
                entry_type: type,
                title: document.getElementById('entryTitle').value,
                content: document.getElementById('entryContent').value,
                structured_data: Object.keys(structured_data).length ? structured_data : null,
                is_confidential: document.getElementById('entryConfidential').checked,
            })
        });
        const data = await res.json();
        if (data.success) {
            closeNewEntry();
            selectEmrPatient(emrPatientId); // reload
        } else {
            alert(data.message || 'Error saving entry');
        }
    } catch (err) { console.error('Save entry error:', err); }
});
