<!-- Hospital Patients List -->
<div class="welcome-section">
    <div class="welcome-text">
        <h1>All Patients</h1>
        <p>Complete patient directory — demographics, plans, referrals, and medical history</p>
    </div>
</div>

<!-- Patient Stats -->
<div class="stats-grid" style="margin-bottom: 1.5rem;">
    <div class="stat-card gradient-primary"><i data-lucide="users" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Total Patients</p><h3 class="stat-value" id="statTotal">—</h3></div></div>
    <div class="stat-card gradient-success"><i data-lucide="user-check" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Active</p><h3 class="stat-value" id="statActive">—</h3></div></div>
    <div class="stat-card gradient-info"><i data-lucide="building" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Under Org/Plan</p><h3 class="stat-value" id="statOrg">—</h3></div></div>
    <div class="stat-card gradient-warning"><i data-lucide="shield-check" class="stat-icon"></i><div class="stat-content"><p class="stat-label">Insured</p><h3 class="stat-value" id="statInsured">—</h3></div></div>
</div>

<!-- Search & Filters -->
<div class="patients-page-header">
    <div class="marketplace-search" style="margin-bottom:0;flex:1;">
        <input type="text" id="patientSearch" placeholder="Search by name, phone, email, national ID..." oninput="debounceSearch()">
        <select id="filterPlan" onchange="loadPatients()"><option value="">All Plans</option><option value="individual">Individual</option><option value="family">Family Plan</option><option value="organization">Organization</option></select>
        <select id="filterInsurance" onchange="loadPatients()"><option value="">Insurance</option><option value="NHIS">NHIS</option><option value="AXA">AXA Mansard</option><option value="Hygeia">Hygeia</option><option value="none">None</option></select>
    </div>
    <button class="btn btn-primary btn-sm" onclick="document.getElementById('addPatientModal').classList.add('show')"><i data-lucide="user-plus"></i> Register Patient</button>
</div>

<!-- Patients Table -->
<div style="overflow-x: auto; margin-top: 1.5rem;">
    <table class="queue-table">
        <thead><tr><th>Patient</th><th>Contact</th><th>Blood/Genotype</th><th>Plan</th><th>Insurance</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="patientsTableBody">
            <tr><td colspan="7" style="text-align:center;color:var(--muted-foreground);padding:2rem;">Loading patients...</td></tr>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;">
    <small id="paginationInfo" style="color:var(--muted-foreground);">Loading...</small>
    <div id="paginationBtns" style="display:flex;gap:0.5rem;"></div>
</div>

<!-- Register Patient Modal -->
<div class="modal-overlay" id="addPatientModal">
    <div class="modal-content" style="max-width:640px;">
        <h2><i data-lucide="user-plus" style="width:20px;height:20px;display:inline;"></i> Register New Patient</h2>
        <form id="registerPatientForm">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group"><label>First Name</label><input type="text" id="regFirstname" required></div>
                <div class="form-group"><label>Last Name</label><input type="text" id="regLastname" required></div>
                <div class="form-group"><label>Phone</label><input type="text" id="regPhone"></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
                <div class="form-group"><label>Gender</label><select id="regGender"><option>male</option><option>female</option><option>other</option></select></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="regDob"></div>
                <div class="form-group"><label>Blood Type</label><select id="regBlood"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
                <div class="form-group"><label>Genotype</label><select id="regGenotype"><option value="">Select</option><option>AA</option><option>AS</option><option>SS</option><option>AC</option><option>SC</option></select></div>
                <div class="form-group"><label>National ID (NIN)</label><input type="text" id="regNIN"></div>
                <div class="form-group"><label>Insurance Provider</label><input type="text" id="regInsurance"></div>
                <div class="form-group"><label>Insurance Number</label><input type="text" id="regInsuranceNum"></div>
            </div>
            <div class="form-group" style="margin-top:0.5rem;"><label>Address</label><input type="text" id="regAddress"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:0.5rem;">
                <div class="form-group"><label>Emergency Contact</label><input type="text" id="regEmergencyName"></div>
                <div class="form-group"><label>Emergency Phone</label><input type="text" id="regEmergencyPhone"></div>
            </div>
            <div class="form-group"><label>Medical Conditions</label><textarea rows="2" id="regConditions"></textarea></div>
            <div class="form-group"><label>Allergies</label><textarea rows="2" id="regAllergies"></textarea></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="document.getElementById('addPatientModal').classList.remove('show')">Cancel</button>
                <button type="submit" class="btn btn-primary">Register Patient</button>
            </div>
        </form>
    </div>
</div>

<script>
let currentPage = 1;
let searchTimer;

function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; loadPatients(); }, 400);
}

async function loadPatients() {
    try {
        const search = document.getElementById('patientSearch').value;
        const plan = document.getElementById('filterPlan').value;
        const insurance = document.getElementById('filterInsurance').value;
        const params = new URLSearchParams({ page: currentPage, limit: 20 });
        if (search) params.set('search', search);
        if (plan) params.set('plan', plan);
        if (insurance) params.set('insurance', insurance);

        const res = await fetch(`/api/hospital/patients?${params}`, { credentials: 'include' });
        const data = await res.json();

        if (data.success) {
            const stats = data.stats || {};
            document.getElementById('statTotal').textContent = (stats.total || 0).toLocaleString();
            document.getElementById('statActive').textContent = (stats.active || 0).toLocaleString();
            document.getElementById('statOrg').textContent = (stats.under_org || 0).toLocaleString();
            document.getElementById('statInsured').textContent = (stats.insured || 0).toLocaleString();
            renderPatients(data.patients || []);
            document.getElementById('paginationInfo').textContent = `Showing ${data.patients.length} patients (page ${data.page})`;
        }
    } catch (err) {
        console.error('Load patients error:', err);
        document.getElementById('patientsTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--destructive);">Failed to load</td></tr>';
    }
}

function renderPatients(patients) {
    const tbody = document.getElementById('patientsTableBody');
    if (!patients.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;">No patients found</td></tr>'; return; }

    tbody.innerHTML = patients.map(p => {
        const initials = ((p.firstname || '')[0] || '') + ((p.lastname || '')[0] || '');
        const age = p.date_of_birth ? Math.floor((Date.now() - new Date(p.date_of_birth)) / 31557600000) : '?';
        const plan = p.organization_id ? `<span class="doctor-type-badge" style="background:hsl(270,60%,50%,0.15);color:hsl(270,60%,65%);">Organization</span>` : `<span class="doctor-type-badge" style="background:hsl(186,82%,47%,0.15);color:var(--primary);">Individual</span>`;
        const ins = p.insurance_provider ? `<small>${p.insurance_provider}<br>#${p.insurance_number || '—'}</small>` : `<small style="color:var(--muted-foreground);">None</small>`;

        return `<tr onclick="loadPatientDetails(${p.patient_id})" style="cursor:pointer;">
            <td><div style="display:flex;align-items:center;gap:0.75rem;"><div class="avatar" style="width:36px;height:36px;font-size:0.75rem;">${initials}</div><div><strong>${p.firstname} ${p.lastname}</strong><br><small style="color:var(--muted-foreground)">${p.gender === 'male' ? 'M' : p.gender === 'female' ? 'F' : '?'} • ${age}yrs • ID: PAT-${p.patient_id}</small></div></div></td>
            <td><small>${p.email || '—'}<br>${p.phone || '—'}</small></td>
            <td><span style="font-weight:600;">${p.blood_type || '?'}</span> / <span>${p.genotype || '?'}</span></td>
            <td>${plan}</td>
            <td>${ins}</td>
            <td><span class="queue-status ${p.status === 'active' ? 'status-checked-in' : 'status-waiting'}">${(p.status || 'Active').charAt(0).toUpperCase() + (p.status || 'active').slice(1)}</span></td>
            <td><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();loadPatientDetails(${p.patient_id})">View</button></td>
        </tr>`;
    }).join('');
}

function loadPatientDetails(patientId) {
    fetch('/export/partials/hospital/patient-details.html')
        .then(r => r.text())
        .then(html => {
            document.querySelector('.main-content').innerHTML = html;
            if (typeof lucide !== 'undefined') lucide.createIcons();
            // Load actual patient data
            if (typeof loadPatientData === 'function') loadPatientData(patientId);
        });
}

document.getElementById('registerPatientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await fetch('/api/hospital/patients', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                firstname: document.getElementById('regFirstname').value,
                lastname: document.getElementById('regLastname').value,
                phone: document.getElementById('regPhone').value,
                email: document.getElementById('regEmail').value,
                gender: document.getElementById('regGender').value,
                date_of_birth: document.getElementById('regDob').value || null,
                blood_type: document.getElementById('regBlood').value || null,
                genotype: document.getElementById('regGenotype').value || null,
                national_id: document.getElementById('regNIN').value || null,
                address: document.getElementById('regAddress').value || null,
                insurance_provider: document.getElementById('regInsurance').value || null,
                insurance_number: document.getElementById('regInsuranceNum').value || null,
                emergency_contact_name: document.getElementById('regEmergencyName').value || null,
                emergency_contact_phone: document.getElementById('regEmergencyPhone').value || null,
                medical_conditions: document.getElementById('regConditions').value || null,
                allergies: document.getElementById('regAllergies').value || null,
            })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('addPatientModal').classList.remove('show');
            document.getElementById('registerPatientForm').reset();
            loadPatients();
        } else { alert(data.message); }
    } catch (err) { console.error('Register error:', err); alert('Failed to register patient.'); }
});

loadPatients();
</script>
